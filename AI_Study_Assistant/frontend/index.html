            {uploading && (
              <div className="mt-4 max-w-md mx-auto p-3.5 bg-[#f6f5f4] dark:bg-[#191919] rounded-xl border border-[#c5e1fb] dark:border-[#0075de]/30 space-y-2">
                <div className="flex items-center justify-between text-xs font-mono text-[#0075de]">
                  <span className="font-bold">Vector Ingestion Pipeline</span>
                  <span className="animate-pulse">Running</span>
                </div>
                <div className="text-xs font-mono text-[#31302e] dark:text-[#d4d4d4] text-left bg-[#ffffff] dark:bg-[#202020] p-2 rounded border border-[#e6e6e6] dark:border-[#2f2f2f]">
                  {uploadStage}
                </div>
                <div className="w-full bg-[#e6e6e6] dark:bg-[#2a2a2a] h-1.5 rounded-full overflow-hidden">
                  <div className="bg-[#0075de] h-full rounded-full animate-pulse" style={{ width: '80%' }}></div>
                </div>
              </div>
            )}
          </div>

          {/* Feedback Banners */}
          {statusMsg && (
            <div className={`p-4 rounded-xl text-xs font-mono flex items-center justify-between border ${
              statusMsg.type === 'success'
                ? "bg-[#eef9f1] dark:bg-[#1aae39]/15 border-[#c6eed0] dark:border-[#1aae39]/30 text-[#1aae39]"
                : statusMsg.type === 'error'
                ? "bg-[#fef4ec] dark:bg-[#dd5b00]/15 border-[#fcdcc4] dark:border-[#dd5b00]/30 text-[#dd5b00]"
                : "bg-[#eef6fc] dark:bg-[#0075de]/15 border-[#c5e1fb] dark:border-[#0075de]/30 text-[#0075de]"
            }`}>
              <span>{statusMsg.text}</span>
              <button onClick={() => setStatusMsg(null)} className="text-[#615d59] dark:text-[#888888] hover:text-[#000000] dark:hover:text-[#ffffff] font-bold ml-4">✕</button>
            </div>
          )}

          {/* Document Inventory Table */}
          <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl overflow-hidden notion-shadow-sm transition-colors">
            <div className="p-4 border-b border-[#e6e6e6] dark:border-[#2f2f2f] flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-[#fdfdfd] dark:bg-[#1d1d1d]">
              <div className="flex items-center space-x-2">
                <span className="text-xs font-mono uppercase font-bold tracking-wider text-[#615d59] dark:text-[#888888]">Registered Documents</span>
                <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-[#f6f5f4] dark:bg-[#191919] text-[#615d59] dark:text-[#888888] border border-[#e6e6e6] dark:border-[#2f2f2f]">
                  {documents.length} Files in Knowledge Base
                </span>
              </div>
              <div>
                <input
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder="Filter documents by name..."
                  className="bg-[#f6f5f4] dark:bg-[#191919] border border-[#dddddd] dark:border-[#383838] rounded-md px-3 py-1.5 text-xs text-[#000000] dark:text-[#ffffff] placeholder:text-[#a39e98] dark:placeholder:text-[#666666] focus:outline-none focus:border-[#0075de] font-sans w-64"
                />
              </div>
            </div>

            {filteredDocs.length === 0 ? (
              <div className="p-10 text-center space-y-2">
                <div className="text-xs font-mono text-[#a39e98] dark:text-[#666666]">
                  {documents.length === 0
                    ? "No study notes indexed yet. Drag and drop a file above or click 'Reload Sample Notes'."
                    : "No documents matching search filter."}
                </div>
              </div>
            ) : (
              <div className="divide-y divide-[#e6e6e6] dark:divide-[#2f2f2f]">
                {filteredDocs.map(doc => {
                  const isPdf = doc.file_type.toLowerCase() === "pdf";
                  const isBeingInspected = inspectDoc === doc.filename;

                  return (
                    <div key={doc.id} className="p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 hover:bg-[#f6f5f4]/60 dark:hover:bg-[#252525] transition">
                      <div className="flex items-start space-x-3.5">
                        <div className={`p-2 rounded-md border text-xs font-mono font-bold uppercase mt-0.5 ${
                          isPdf
                            ? "bg-[#fff0f9] dark:bg-[#ff64c8]/15 border-[#ffd1f0] dark:border-[#ff64c8]/30 text-[#ff64c8]"
                            : "bg-[#eef6fc] dark:bg-[#0075de]/15 border-[#c5e1fb] dark:border-[#0075de]/30 text-[#0075de]"
                        }`}>
                          {doc.file_type}
                        </div>
                        <div>
                          <div className="text-xs font-bold text-[#000000] dark:text-[#ffffff]">{doc.filename}</div>
                          <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs font-mono text-[#615d59] dark:text-[#888888] mt-0.5">
                            <span>Chunks: <strong className="text-[#0075de]">{doc.chunks_count}</strong></span>
                            <span>•</span>
                            <span>Size: {(doc.file_size_bytes / 1024).toFixed(1)} KB</span>
                            <span>•</span>
                            <span>Indexed: {doc.uploaded_at ? new Date(doc.uploaded_at).toLocaleDateString() : "Active"}</span>
                            <span>•</span>
                            <span className="text-[#1aae39] font-semibold">[Indexed Chunk]</span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center space-x-2 self-end md:self-auto">
                        <button
                          onClick={() => handleInspect(doc.filename)}
                          className={`text-xs font-mono px-3 py-1.5 rounded-md border transition flex items-center space-x-1.5 ${
                            isBeingInspected
                              ? "bg-[#0075de] text-white border-[#0075de]"
                              : "bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border-[#e6e6e6] dark:border-[#2f2f2f] text-[#31302e] dark:text-[#d4d4d4]"
                          }`}
                        >
                          <span>{isBeingInspected ? "Inspecting" : "Inspect Chunks"}</span>
                        </button>

                        <button
                          onClick={() => handleDelete(doc.filename)}
                          className="text-xs font-mono text-[#dd5b00] hover:text-[#793400] px-3 py-1.5 rounded-md bg-[#ffffff] dark:bg-[#202020] hover:bg-[#fef4ec] dark:hover:bg-[#dd5b00]/20 border border-[#e6e6e6] dark:border-[#2f2f2f] transition"
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Interactive Chunk Inspector Panel */}
          {inspectDoc && (
            <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#c5e1fb] dark:border-[#0075de]/30 rounded-xl p-6 space-y-4 notion-shadow transition-colors">
              <div className="flex items-center justify-between pb-3 border-b border-[#e6e6e6] dark:border-[#2f2f2f]">
                <div>
                  <div className="text-xs font-mono text-[#0075de] uppercase font-bold">Chunk Inspector</div>
                  <h3 className="text-lg font-bold text-[#000000] dark:text-[#ffffff] mt-0.5">{inspectDoc}</h3>
                </div>
                <div className="flex items-center space-x-3">
                  <span className="text-xs font-mono text-[#615d59] dark:text-[#888888]">
                    {docChunks.length} Chunks Loaded
                  </span>
                  <button
                    onClick={() => setInspectDoc(null)}
                    className="text-xs font-mono px-3 py-1 rounded-md bg-[#f6f5f4] dark:bg-[#191919] hover:bg-[#e6e6e6] dark:hover:bg-[#2a2a2a] text-[#31302e] dark:text-[#d4d4d4]"
                  >
                    Close
                  </button>
                </div>
              </div>

              {loadingChunks ? (
                <div className="p-8 text-center text-xs font-mono text-[#0075de]">
                  Loading notes snippets from library...
                </div>
              ) : docChunks.length === 0 ? (
                <div className="p-6 text-center text-xs font-mono text-[#a39e98] dark:text-[#666666]">
                  No chunk records found for this document in active index.
                </div>
              ) : (
                <div className="space-y-3 max-h-96 overflow-y-auto pr-2">
                  {docChunks.map((chunk, cIdx) => (
                    <div key={cIdx} className="p-4 bg-[#f6f5f4] dark:bg-[#191919] rounded-lg border border-[#e6e6e6] dark:border-[#2f2f2f] space-y-2">
                      <div className="flex items-center justify-between text-xs font-mono">
                        <span className="text-[#0075de] font-bold">Chunk #{chunk.chunk_id + 1}</span>
                        <div className="flex items-center space-x-2 text-[#615d59] dark:text-[#888888]">
                          <span>Page {chunk.page_number}</span>
                          <span>•</span>
                          <span>{chunk.char_length} Characters</span>
                        </div>
                      </div>
                      <p className="text-xs text-[#31302e] dark:text-[#d4d4d4] leading-relaxed font-sans bg-[#ffffff] dark:bg-[#202020] p-3 rounded border border-[#e6e6e6] dark:border-[#2f2f2f]">
                        {chunk.text}
                      </p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. NOTION SUMMARIZER TOOL VIEW
    // ==========================================
    function SummarizerView() {
      const [maxPoints, setMaxPoints] = useState(5);
      const [selectedDoc, setSelectedDoc] = useState("");
      const [docList, setDocList] = useState([]);
      const [summary, setSummary] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch(`${API_BASE}/documents`)
          .then(r => r.json())
          .then(data => {
            if (Array.isArray(data)) setDocList(data);
          })
          .catch(() => {});
      }, []);

      const handleSummarize = async () => {
        setLoading(true);
        setError(null);
        setSummary(null);

        try {
          const payload = { max_points: maxPoints };
          if (selectedDoc) payload.document_name = selectedDoc;

          const res = await fetch(`${API_BASE}/summarize`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const data = await res.json();
            setError(formatErrorDetail(data, "Summarization failed"));
          } else {
            const data = await res.json();
            setSummary(data);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-4 pb-6">
          <div>
            <h2 className="text-2xl font-bold text-[#000000] dark:text-[#ffffff] tracking-heading">Notes Summarizer Tool</h2>
            <p className="text-xs text-[#615d59] dark:text-[#888888] mt-1">Distill lengthy study material into structured executive overviews and core takeaways.</p>
          </div>

          <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] p-4 sm:p-5 rounded-xl space-y-4 notion-shadow-sm transition-colors">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-mono uppercase font-bold text-[#615d59] dark:text-[#888888] mb-2">Document to Summarize:</label>
                <select
                  value={selectedDoc}
                  onChange={(e) => setSelectedDoc(e.target.value)}
                  className="w-full bg-[#ffffff] dark:bg-[#191919] border border-[#dddddd] dark:border-[#383838] rounded-md p-2.5 text-xs text-[#000000] dark:text-[#ffffff] focus:outline-none focus:border-[#0075de] font-sans"
                >
                  <option value="">All Uploaded Notes</option>
                  {docList.map(d => (
                    <option key={d.filename} value={d.filename}>{d.filename} ({d.chunks_count} chunks)</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs font-mono uppercase font-bold text-[#615d59] dark:text-[#888888] mb-2">Max Takeaway Points: {maxPoints}</label>
                <input
                  type="range"
                  min="3"
                  max="10"
                  value={maxPoints}
                  onChange={(e) => setMaxPoints(parseInt(e.target.value))}
                  className="w-full accent-[#0075de] cursor-pointer mt-2"
                />
              </div>
            </div>
            <button
              onClick={handleSummarize}
              disabled={loading}
              className="bg-[#0075de] hover:bg-[#005bab] disabled:bg-[#e6e6e6] dark:disabled:bg-[#2a2a2a] disabled:text-[#a39e98] px-6 py-2.5 rounded-full text-xs font-semibold text-white transition shadow-sm font-sans"
            >
              {loading ? "Analyzing Notes..." : "Generate Summary"}
            </button>
          </div>

          {error && (
            <div className="p-4 bg-[#fef4ec] dark:bg-[#dd5b00]/15 border border-[#fcdcc4] dark:border-[#dd5b00]/30 rounded-xl text-xs text-[#dd5b00]">
              {error}
            </div>
          )}

          {summary && (
            <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl p-6 space-y-5 notion-shadow-sm transition-colors">
              <div>
                <div className="text-xs font-mono text-[#0075de] uppercase font-bold">Document Analyzed</div>
                <div className="text-lg font-bold text-[#000000] dark:text-[#ffffff] mt-1">{summary.document_name}</div>
              </div>

              <div>
                <div className="text-xs font-mono uppercase font-bold text-[#615d59] dark:text-[#888888] mb-2">Executive Summary:</div>
                <p className="text-xs text-[#31302e] dark:text-[#d4d4d4] leading-relaxed bg-[#f6f5f4] dark:bg-[#191919] p-4 rounded-xl border border-[#e6e6e6] dark:border-[#2f2f2f]">
                  {summary.executive_summary}
                </p>
              </div>

              <div>
                <div className="text-xs font-mono uppercase font-bold text-[#615d59] dark:text-[#888888] mb-2">Key Core Takeaways:</div>
                <ul className="space-y-2">
                  {summary.key_takeaways.map((pt, idx) => (
                    <li key={idx} className="text-xs text-[#31302e] dark:text-[#d4d4d4] flex items-start space-x-2">
                      <span className="text-[#0075de] font-mono text-xs mt-0.5">•</span>
                      <span>{pt}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. NOTION PRACTICE QUIZ GENERATOR VIEW
    // ==========================================
    function QuizView({ onRefreshMetrics }) {
      const [topic, setTopic] = useState("Python");
      const [numQuestions, setNumQuestions] = useState(3);
      const [quizData, setQuizData] = useState(null);
      const [userAnswers, setUserAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const [loading, setLoading] = useState(false);

      const handleGenerate = async () => {
        setLoading(true);
        setQuizData(null);
        setUserAnswers({});
        setSubmitted(false);

        try {
          const res = await fetch(`${API_BASE}/quiz`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic, num_questions: numQuestions })
          });

          if (res.ok) {
            const data = await res.json();
            setQuizData(data);
          }
        } catch (e) {
          alert("Quiz generation failed: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      const handleOptionSelect = (qId, opt) => {
        if (submitted) return;
        const optLetter = opt.charAt(0);
        setUserAnswers(prev => ({ ...prev, [qId]: optLetter }));
      };

      const handleSubmitQuiz = async () => {
        if (!quizData || !quizData.questions) return;
        let calculatedScore = 0;
        quizData.questions.forEach(q => {
          if (userAnswers[q.id] === q.correct_option) {
            calculatedScore += 1;
          }
        });

        setScore(calculatedScore);
        setSubmitted(true);

        try {
          await fetch(`${API_BASE}/quiz/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              topic: quizData.topic || topic,
              score: calculatedScore,
              total_questions: quizData.questions.length
            })
          });
          onRefreshMetrics();
        } catch (e) {
          console.error("Error persisting quiz result", e);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-4 pb-6">
          <div>
            <h2 className="text-2xl font-bold text-[#000000] dark:text-[#ffffff] tracking-heading">Interactive MCQ Quiz Generator</h2>
            <p className="text-xs text-[#615d59] dark:text-[#888888] mt-1">Generate multiple-choice practice tests grounded in your study notes with explanations.</p>
          </div>

          <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] p-4 sm:p-5 rounded-xl space-y-4 notion-shadow-sm transition-colors">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-mono uppercase font-bold text-[#615d59] dark:text-[#888888] mb-2">Subject / Topic:</label>
                <select
                  value={topic}
                  onChange={(e) => setTopic(e.target.value)}
                  className="w-full bg-[#ffffff] dark:bg-[#191919] border border-[#dddddd] dark:border-[#383838] rounded-md p-2.5 text-xs text-[#000000] dark:text-[#ffffff] focus:outline-none focus:border-[#0075de] font-sans"
                >
                  <option value="Python">Python Internals</option>
                  <option value="Machine Learning">Machine Learning & Regularization</option>
                  <option value="Artificial Intelligence">Artificial Intelligence & Search</option>
                  <option value="MongoDB">MongoDB NoSQL & Aggregations</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-mono uppercase font-bold text-[#615d59] dark:text-[#888888] mb-2">Number of Questions: {numQuestions}</label>
                <input
                  type="range"
                  min="1"
                  max="5"
                  value={numQuestions}
                  onChange={(e) => setNumQuestions(parseInt(e.target.value))}
                  className="w-full accent-[#0075de] cursor-pointer mt-2"
                />
              </div>
            </div>
            <button
              onClick={handleGenerate}
              disabled={loading}
              className="bg-[#0075de] hover:bg-[#005bab] disabled:bg-[#e6e6e6] dark:disabled:bg-[#2a2a2a] disabled:text-[#a39e98] px-6 py-2.5 rounded-full text-xs font-semibold text-white transition shadow-sm font-sans"
            >
              {loading ? "Generating Quiz..." : "Generate Practice Quiz"}
            </button>
          </div>

          {quizData && quizData.questions && (
            <div className="space-y-6">
              {quizData.questions.map((q, qIndex) => (
                <div key={q.id} className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl p-6 space-y-3 notion-shadow-sm transition-colors">
                  <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">
                    <span className="text-[#0075de] font-mono mr-2 font-bold">Q{qIndex + 1}.</span>
                    {q.question}
                  </div>

                  <div className="space-y-2 pt-2">
                    {q.options.map((opt, oIndex) => {
                      const letter = opt.charAt(0);
                      const isSelected = userAnswers[q.id] === letter;
                      const isCorrect = q.correct_option === letter;

                      let btnStyle = "bg-[#f6f5f4] dark:bg-[#191919] border-[#e6e6e6] dark:border-[#2f2f2f] text-[#31302e] dark:text-[#d4d4d4] hover:bg-[#ffffff] dark:hover:bg-[#2a2a2a] hover:border-[#0075de]";
                      if (submitted) {
                        if (isCorrect) {
                          btnStyle = "bg-[#eef9f1] dark:bg-[#1aae39]/15 border-[#c6eed0] dark:border-[#1aae39]/30 text-[#1aae39] font-semibold";
                        } else if (isSelected && !isCorrect) {
                          btnStyle = "bg-[#fef4ec] dark:bg-[#dd5b00]/15 border-[#fcdcc4] dark:border-[#dd5b00]/30 text-[#dd5b00]";
                        }
                      } else if (isSelected) {
                        btnStyle = "bg-[#eef6fc] dark:bg-[#0075de]/15 border-[#0075de] text-[#0075de] dark:text-[#62aef0] font-semibold shadow-sm";
                      }

                      return (
                        <button
                          key={oIndex}
                          onClick={() => handleOptionSelect(q.id, opt)}
                          className={`w-full text-left p-3 rounded-lg text-xs font-sans border transition ${btnStyle}`}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>

                  {submitted && (
                    <div className="mt-3 p-3 bg-[#f6f5f4] dark:bg-[#191919] rounded-lg border border-[#e6e6e6] dark:border-[#2f2f2f] text-xs font-mono">
                      <div className="text-[#1aae39] font-bold">Correct Option: {q.correct_option}</div>
                      <div className="text-[#615d59] dark:text-[#888888] mt-1 font-sans">{q.explanation}</div>
                    </div>
                  )}
                </div>
              ))}

              {!submitted ? (
                <button
                  onClick={handleSubmitQuiz}
                  className="w-full bg-[#1aae39] hover:bg-[#169631] text-white py-3 rounded-full font-bold text-xs uppercase tracking-wider font-sans transition shadow-sm"
                >
                  Submit Quiz Answers
                </button>
              ) : (
                <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#c6eed0] dark:border-[#1aae39]/30 p-6 rounded-xl text-center space-y-2 notion-shadow-sm transition-colors">
                  <div className="text-xs uppercase font-mono text-[#1aae39] font-bold">Final Quiz Scorecard</div>
                  <div className="text-3xl font-bold text-[#000000] dark:text-[#ffffff] font-mono">{score} / {quizData.questions.length}</div>
                  <p className="text-xs text-[#615d59] dark:text-[#888888]">Score percentage: {((score / quizData.questions.length) * 100).toFixed(0)}% recorded to database.</p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. NOTION AUTONOMOUS AI AGENT VIEW
    // ==========================================
    function AgentView({ onRefreshMetrics }) {
      const [prompt, setPrompt] = useState("");
      const [agentResult, setAgentResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [isListening, setIsListening] = useState(false);
      const recognitionRef = useRef(null);

      const toggleVoiceInput = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Voice recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
          return;
        }
        if (isListening) {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch(e) {}
          }
          setIsListening(false);
          return;
        }
        try {
          const recognition = new SpeechRecognition();
          recognitionRef.current = recognition;
          recognition.lang = "en-IN";
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;
          recognition.onstart = () => setIsListening(true);
          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setPrompt(prev => (prev ? prev + " " + transcript : transcript));
            setIsListening(false);
          };
          recognition.onerror = (event) => {
            console.error("Speech recognition error", event);
            setIsListening(false);
          };
          recognition.onend = () => {
            setIsListening(false);
            recognitionRef.current = null;
          };
          recognition.start();
        } catch (e) {
          console.error("Speech recognition start failed", e);
          setIsListening(false);
        }
      };

      const handleRunAgent = async (e) => {
        e.preventDefault();
        if (!prompt.trim() || loading) return;

        setLoading(true);
        setError(null);
        setAgentResult(null);

        try {
          const res = await fetch(`${API_BASE}/agent`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });

          if (!res.ok) {
            const data = await res.json();
            setError(formatErrorDetail(data, "Agent workflow execution failed"));
          } else {
            const data = await res.json();
            setAgentResult(data);
            onRefreshMetrics();
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-4 pb-6">
          <div>
            <h2 className="text-2xl font-bold text-[#000000] dark:text-[#ffffff] tracking-heading">Autonomous AI Agent</h2>
            <p className="text-xs text-[#615d59] dark:text-[#888888] mt-1">Natural language prompt routing. The agent automatically detects intent and executes Answer, Summary, or Quiz tool.</p>
          </div>

          <form onSubmit={handleRunAgent} className="space-y-3">
            {isListening && (
              <div className="text-[11px] font-mono text-[#dd5b00] flex items-center space-x-1.5 animate-pulse pb-1 px-1">
                <span className="h-2 w-2 rounded-full bg-[#dd5b00]"></span>
                <span>Listening to your voice... Speak your prompt now</span>
              </div>
            )}
            <div className="flex gap-2">
              <input
                type="text"
                value={prompt}
                onChange={(e) => setPrompt(e.target.value)}
                placeholder="e.g. 'Summarize my notes', 'Create 3 MCQs on Python', or 'Explain the GIL'"
                className="flex-1 bg-[#ffffff] dark:bg-[#202020] border border-[#dddddd] dark:border-[#383838] rounded-md px-4 py-2.5 text-xs text-[#000000] dark:text-[#ffffff] focus:outline-none focus:border-[#0075de] font-sans shadow-sm transition-colors"
              />
              <button
                type="button"
                onClick={toggleVoiceInput}
                title={isListening ? "Listening... Click to stop" : "Voice input - speak your question"}
                className={`p-2.5 rounded-full border transition flex items-center justify-center shadow-sm ${
                  isListening
                    ? "bg-[#dd5b00] text-white border-[#dd5b00] animate-pulse"
                    : "bg-[#ffffff] dark:bg-[#202020] text-[#615d59] dark:text-[#888888] hover:text-[#0075de] hover:border-[#0075de] border-[#dddddd] dark:border-[#383838]"
                }`}
              >
                <Icons.Mic />
              </button>
              <button
                type="submit"
                disabled={loading || !prompt.trim()}
                className="bg-[#0075de] hover:bg-[#005bab] disabled:bg-[#e6e6e6] dark:disabled:bg-[#2a2a2a] disabled:text-[#a39e98] px-6 py-2.5 rounded-full text-xs font-semibold text-white transition shadow-sm font-sans"
              >
                {loading ? "Agent Running..." : "Execute"}
              </button>
            </div>
            <div className="flex flex-wrap items-center gap-2 text-xs font-mono text-[#615d59] dark:text-[#888888]">
              <span className="text-[#a39e98] dark:text-[#666666]">Suggested Prompts:</span>
              <button
                type="button"
                onClick={() => setPrompt("Explain Python memory management and the GIL")}
                className="px-2.5 py-1 rounded-full bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border border-[#c5e1fb] dark:border-[#0075de]/30 text-[#0075de] transition text-[11px] font-sans shadow-sm"
              >
                [Q&A] "Explain GIL"
              </button>
              <button
                type="button"
                onClick={() => setPrompt("Summarize MongoDB Handbook.pdf")}
                className="px-2.5 py-1 rounded-full bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border border-[#c5e1fb] dark:border-[#0075de]/30 text-[#0075de] transition text-[11px] font-sans shadow-sm"
              >
                [Summary] "Summarize MongoDB"
              </button>
              <button
                type="button"
                onClick={() => setPrompt("Create a 3 question practice quiz on MongoDB")}
                className="px-2.5 py-1 rounded-full bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border border-[#fcdcc4] dark:border-[#dd5b00]/30 text-[#dd5b00] transition text-[11px] font-sans shadow-sm"
              >
                [Quiz] "MongoDB Quiz"
              </button>
              <button
                type="button"
                onClick={() => setPrompt("Create 3 MCQs on Machine Learning")}
                className="px-2.5 py-1 rounded-full bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border border-[#c6eed0] dark:border-[#1aae39]/30 text-[#1aae39] transition text-[11px] font-sans shadow-sm"
              >
                [Quiz] "ML MCQs"
              </button>
            </div>
          </form>

          {error && (
            <div className="p-4 bg-[#fef4ec] dark:bg-[#dd5b00]/15 border border-[#fcdcc4] dark:border-[#dd5b00]/30 rounded-xl text-xs text-[#dd5b00]">
              {error}
            </div>
          )}

          {agentResult && (
            <div className="space-y-6">
              <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl p-6 notion-shadow-sm transition-colors">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 border-b border-[#e6e6e6] dark:border-[#2f2f2f] pb-4">
                  <div>
                    <div className="text-xs font-mono text-[#615d59] dark:text-[#888888]">Detected Intent</div>
                    <div className="text-xl font-bold text-[#0075de] mt-1 font-mono">{agentResult.intent}</div>
                  </div>
                  <div>
                    <div className="text-xs font-mono text-[#615d59] dark:text-[#888888]">Confidence Score</div>
                    <div className="text-xl font-bold text-[#1aae39] mt-1 font-mono">{(agentResult.confidence * 100).toFixed(0)}%</div>
                  </div>
                  <div>
                    <div className="text-xs font-mono text-[#615d59] dark:text-[#888888]">Routed Tool</div>
                    <div className="text-xl font-bold text-[#dd5b00] mt-1 font-mono">{agentResult.tool_used}</div>
                  </div>
                </div>

                <div className="mt-4">
                  <div className="text-xs font-mono uppercase font-bold text-[#615d59] dark:text-[#888888] mb-2 flex items-center justify-between">
                    <span>Autonomous State Machine Trace:</span>
                    <span className="text-[10px] text-[#1aae39] font-bold bg-[#eef9f1] dark:bg-[#1aae39]/15 px-2 py-0.5 rounded-full border border-[#c6eed0] dark:border-[#1aae39]/30">
                      {agentResult.execution_trace.length} States Resolved
                    </span>
                  </div>
                  <div className="bg-[#f6f5f4] dark:bg-[#191919] rounded-xl p-4 border border-[#e6e6e6] dark:border-[#2f2f2f] space-y-2 font-mono text-xs shadow-inner">
                    {agentResult.execution_trace.map((step, idx) => {
                      let tagColor = "bg-[#ffffff] dark:bg-[#202020] text-[#31302e] dark:text-[#d4d4d4] border-[#e6e6e6] dark:border-[#2f2f2f]";
                      let tagText = "STEP";
                      if (step.includes("[START]")) {
                        tagColor = "bg-[#eef6fc] dark:bg-[#0075de]/15 text-[#0075de] border-[#c5e1fb] dark:border-[#0075de]/30";
                        tagText = "START";
                      } else if (step.includes("[INTENT_DETECTION]")) {
                        tagColor = "bg-[#f8f2fd] dark:bg-[#d6b6f6]/15 text-[#391c57] dark:text-[#d6b6f6] border-[#ecdcfc] dark:border-[#d6b6f6]/30";
                        tagText = "INTENT";
                      } else if (step.includes("[TOOL_ROUTED]")) {
                        tagColor = "bg-[#fef4ec] dark:bg-[#dd5b00]/15 text-[#dd5b00] border-[#fcdcc4] dark:border-[#dd5b00]/30";
                        tagText = "ROUTER";
                      } else if (step.includes("[EXECUTION_SUCCESS]")) {
                        tagColor = "bg-[#eef9f1] dark:bg-[#1aae39]/15 text-[#1aae39] border-[#c6eed0] dark:border-[#1aae39]/30";
                        tagText = "EXEC";
                      } else if (step.includes("[RESPONSE_SYNTHESIS]")) {
                        tagColor = "bg-[#fff0f9] dark:bg-[#ff64c8]/15 text-[#ff64c8] border-[#ffd1f0] dark:border-[#ff64c8]/30";
                        tagText = "SYNTH";
                      }
                      return (
                        <div key={idx} className="flex items-start space-x-2.5 p-2 rounded-lg bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f]">
                          <span className={`px-1.5 py-0.5 text-[9px] font-bold rounded-full border uppercase shrink-0 ${tagColor}`}>
                            {tagText}
                          </span>
                          <span className="text-[#31302e] dark:text-[#d4d4d4] leading-relaxed font-mono text-[11px] flex-1">
                            {step.replace(/^\[[A-Z_]+\]\s*/, "")}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl p-6 space-y-2 notion-shadow-sm transition-colors">
                <div className="text-xs font-mono uppercase font-bold text-[#615d59] dark:text-[#888888]">Synthesized Agent Response:</div>
                <div className="bg-[#f6f5f4] dark:bg-[#191919] p-5 rounded-lg border border-[#e6e6e6] dark:border-[#2f2f2f] text-xs text-[#31302e] dark:text-[#d4d4d4] font-sans">
                  <FormattedTutorResponse text={agentResult.agent_response} />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. INTERACTIVE 3D FLIP FLASHCARDS VIEW
    // ==========================================
    function FlashcardsView() {
      const [cards, setCards] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [loading, setLoading] = useState(true);
      const [filterTopic, setFilterTopic] = useState("All");
      const [knownCount, setKnownCount] = useState(0);

      const loadCards = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/flashcards?count=30`);
          if (res.ok) {
            const data = await res.json();
            setCards(data || []);
            setCurrentIndex(0);
            setIsFlipped(false);
          }
        } catch (e) {
          console.error("Failed to load flashcards", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadCards();
      }, []);

      const savedCount = cards.filter(c => c.is_saved || (c.topic || "").toLowerCase().includes("saved")).length;
      const otherTopics = Array.from(new Set(cards.map(c => c.topic))).filter(t => t && !t.toLowerCase().includes("saved"));
      const availableTopics = [
        "All",
        ...(savedCount > 0 ? [`Saved Recall (${savedCount})`] : []),
        ...otherTopics
      ];

      const filteredCards = filterTopic === "All"
        ? cards
        : filterTopic.startsWith("Saved Recall")
          ? cards.filter(c => c.is_saved || (c.topic || "").toLowerCase().includes("saved"))
          : cards.filter(c => (c.topic || "").toLowerCase() === filterTopic.toLowerCase());

      const currentCard = filteredCards[currentIndex];

      const handleDeleteCard = async (e, cardId) => {
        e.stopPropagation();
        if (!confirm("Remove this question from Saved Recall?")) return;
        try {
          const res = await fetch(`${API_BASE}/flashcards/saved/${cardId}`, { method: "DELETE" });
          if (res.ok) {
            setCards(prev => prev.filter(c => c.id !== cardId));
            if (currentIndex > 0) setCurrentIndex(prev => prev - 1);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleNext = () => {
        if (currentIndex < filteredCards.length - 1) {
          setIsFlipped(false);
          setCurrentIndex(prev => prev + 1);
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setIsFlipped(false);
          setCurrentIndex(prev => prev - 1);
        }
      };

      const handleShuffle = () => {
        setIsFlipped(false);
        setCards(prev => [...prev].sort(() => Math.random() - 0.5));
        setCurrentIndex(0);
      };

      const handleMarkMastered = () => {
        setKnownCount(prev => prev + 1);
        handleNext();
      };

      return (
        <div className="max-w-4xl mx-auto space-y-3.5 pb-6 select-none">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[#e6e6e6] dark:border-[#2f2f2f]">
            <div>
              <h2 className="text-2xl font-bold text-[#000000] dark:text-[#ffffff] tracking-heading">Interactive 3D Flashcards</h2>
              <p className="text-xs text-[#615d59] dark:text-[#888888] mt-0.5">Active recall flashcards from study notes and your favorite bookmarked chat questions.</p>
            </div>
            <div className="flex items-center space-x-2 text-xs font-mono">
              <span className="px-3 py-1 rounded-full bg-[#fef4ec] dark:bg-[#dd5b00]/15 text-[#dd5b00] border border-[#fcdcc4] dark:border-[#dd5b00]/30 font-semibold">
                Active Recall
              </span>
            </div>
          </div>

          {/* Filter Bar & Progress */}
          <div className="flex flex-wrap items-center justify-between gap-2 text-xs font-mono">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-[#a39e98] dark:text-[#666666]">Deck:</span>
              {availableTopics.map(t => (
                <button
                  key={t}
                  onClick={() => { setFilterTopic(t); setCurrentIndex(0); setIsFlipped(false); }}
                  className={`px-2.5 py-1 rounded-full border transition flex items-center space-x-1 ${
                    filterTopic === t
                      ? "bg-[#0075de] text-white border-[#0075de] font-semibold"
                      : t.startsWith("Saved Recall")
                        ? "bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400 border-red-200 dark:border-red-900 font-semibold"
                        : "bg-[#ffffff] dark:bg-[#202020] text-[#615d59] dark:text-[#888888] border-[#e6e6e6] dark:border-[#2f2f2f] hover:text-[#0075de] dark:hover:text-[#62aef0]"
                  }`}
                >
                  {t.startsWith("Saved Recall") && <Icons.Heart filled={true} />}
                  <span>{t}</span>
                </button>
              ))}
            </div>

            <div className="text-[#615d59] dark:text-[#888888]">
              Mastered: <span className="font-bold text-[#1aae39]">{knownCount}</span>
            </div>
          </div>

          {loading ? (
            <div className="p-8 text-center text-xs font-mono text-[#0075de] animate-pulse">
              [Loading active recall flashcards...]
            </div>
          ) : filteredCards.length === 0 ? (
            <div className="p-8 text-center bg-[#ffffff] dark:bg-[#202020] rounded-xl border border-[#e6e6e6] dark:border-[#2f2f2f] text-xs text-[#615d59] dark:text-[#888888] space-y-2">
              <p>No flashcards found for this topic.</p>
              <p className="text-[11px] text-[#a39e98]">Tip: In AI Chat, tap the heart icon on any answer to save it into your Recall deck!</p>
            </div>
          ) : (
            <div className="space-y-4">
              {/* 3D Flip Card Container */}
              <div
                onClick={() => setIsFlipped(!isFlipped)}
                className="perspective-1000 cursor-pointer w-full h-[22rem] sm:h-[24rem]"
              >
                <div
                  className={`relative w-full h-full duration-500 transform-style-3d transition-transform ${
                    isFlipped ? "rotate-y-180" : ""
                  }`}
                >
                  {/* Card Front (Question / Concept) */}
                  <div className="absolute w-full h-full backface-hidden bg-[#ffffff] dark:bg-[#202020] border-2 border-[#e6e6e6] dark:border-[#2f2f2f] rounded-2xl p-6 flex flex-col justify-between shadow-md hover:border-[#0075de] transition-colors">
                    <div className="flex items-center justify-between text-xs font-mono">
                      <div className="flex items-center space-x-1.5">
                        <span className="px-2.5 py-0.5 rounded-full bg-[#eef6fc] dark:bg-[#0075de]/15 text-[#0075de] border border-[#c5e1fb] dark:border-[#0075de]/30 font-semibold">
                          {currentCard.topic}
                        </span>
                        {currentCard.is_saved && (
                          <span className="px-2 py-0.5 rounded-full bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900 text-[10px] font-semibold flex items-center space-x-1">
                            <Icons.Heart filled={true} />
                            <span>Saved from {currentCard.source || "Chat"}</span>
                          </span>
                        )}
                      </div>
                      <div className="flex items-center space-x-2">
                        {currentCard.is_saved && (
                          <button
                            type="button"
                            onClick={(e) => handleDeleteCard(e, currentCard.id)}
                            className="text-[10px] text-red-500 hover:text-red-700 underline font-mono cursor-pointer"
                            title="Remove from saved recall"
                          >
                            Remove
                          </button>
                        )}
                        <span className="text-[#a39e98] dark:text-[#666666]">
                          Card {currentIndex + 1} of {filteredCards.length}
                        </span>
                      </div>
                    </div>

                    <div className="text-center my-auto px-4 py-6">
                      <span className="text-[11px] font-mono text-[#a39e98] dark:text-[#666666] uppercase tracking-wider block mb-2">Question / Recall Prompt</span>
                      <h3 className="text-lg md:text-xl font-bold text-[#000000] dark:text-[#ffffff] leading-snug">
                        {currentCard.front}
                      </h3>
                    </div>

                    <div className="text-center text-[11px] font-mono text-[#a39e98] dark:text-[#666666]">
                      Click card or press Flip to reveal answer
                    </div>
                  </div>

                  {/* Card Back (Answer / Key Takeaway) */}
                  <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-[#0075de] text-white rounded-2xl p-6 flex flex-col justify-between shadow-md overflow-hidden">
                    <div className="flex items-center justify-between text-xs font-mono text-white/80">
                      <div className="flex items-center space-x-1.5">
                        <span className="px-2.5 py-0.5 rounded-full bg-white/20 text-white font-semibold">
                          {currentCard.topic} - Answer
                        </span>
                        {currentCard.is_saved && (
                          <span className="px-2 py-0.5 rounded-full bg-white/20 text-white text-[10px] font-semibold">
                            Saved Question
                          </span>
                        )}
                      </div>
                      <span>Card {currentIndex + 1} of {filteredCards.length}</span>
                    </div>

                    <div className="my-auto px-4 py-4 max-h-56 overflow-y-auto text-left font-sans text-xs leading-relaxed text-white/95">
                      <span className="text-[10px] font-mono text-white/70 uppercase tracking-wider block mb-1.5 font-bold">Explanation & Solution</span>
                      <p className="whitespace-pre-line">
                        {currentCard.back}
                      </p>
                    </div>

                    <div className="text-center text-[11px] font-mono text-white/70 pt-2 border-t border-white/20">
                      Click to flip back to question
                    </div>
                  </div>
                </div>
              </div>

              {/* Controls Bar */}
              <div className="flex items-center justify-between gap-2 pt-2">
                <button
                  onClick={handlePrev}
                  disabled={currentIndex === 0}
                  className="px-4 py-2 rounded-lg border border-[#e6e6e6] dark:border-[#2f2f2f] bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] disabled:opacity-40 text-xs font-semibold text-[#000000] dark:text-[#ffffff] transition shadow-sm font-sans"
                >
                  ← Previous
                </button>

                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => setIsFlipped(!isFlipped)}
                    className="px-5 py-2 rounded-lg bg-[#0075de] hover:bg-[#005bab] text-white text-xs font-semibold transition shadow-sm font-sans"
                  >
                    {isFlipped ? "Show Question" : "Flip Card"}
                  </button>
                  <button
                    onClick={handleShuffle}
                    className="px-3 py-2 rounded-lg border border-[#e6e6e6] dark:border-[#2f2f2f] bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] text-xs text-[#615d59] dark:text-[#888888] hover:text-[#000000] dark:hover:text-[#ffffff] transition shadow-sm font-sans"
                    title="Shuffle Cards"
                  >
                    Shuffle
                  </button>
                  <button
                    onClick={handleMarkMastered}
                    className="px-4 py-2 rounded-lg bg-[#eef9f1] dark:bg-[#1aae39]/15 hover:bg-[#c6eed0] text-[#1aae39] border border-[#c6eed0] dark:border-[#1aae39]/30 text-xs font-semibold transition shadow-sm font-sans"
                  >
                    Mark Mastered
                  </button>
                </div>

                <button
                  onClick={handleNext}
                  disabled={currentIndex === filteredCards.length - 1}
                  className="px-4 py-2 rounded-lg border border-[#e6e6e6] dark:border-[#2f2f2f] bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] disabled:opacity-40 text-xs font-semibold text-[#000000] dark:text-[#ffffff] transition shadow-sm font-sans"
                >
                  Next →
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 9. NOTION SYSTEM HEALTH & DIAGNOSTICS VIEW
    // ==========================================
    function SettingsView({ status, darkMode, onToggleTheme }) {
      return (
        <div className="max-w-4xl mx-auto space-y-4 pb-6">
          <div>
            <h2 className="text-2xl font-bold text-[#000000] dark:text-[#ffffff] tracking-heading">System Diagnostics & Security Settings</h2>
            <p className="text-xs text-[#615d59] dark:text-[#888888] mt-1">Runtime health, guardrail parameters, and active models.</p>
          </div>

          <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl divide-y divide-[#e6e6e6] dark:divide-[#2f2f2f] notion-shadow-sm transition-colors">
            {/* Appearance Setting Row */}
            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Theme & Appearance</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">Toggle between Notion Daylight Mode and Dark Mode</div>
              </div>
              <button
                onClick={onToggleTheme}
                className="px-3 py-1.5 rounded-full border border-[#e6e6e6] dark:border-[#383838] bg-[#f6f5f4] dark:bg-[#2a2a2a] text-xs font-mono font-semibold flex items-center space-x-2 text-[#31302e] dark:text-[#e0e0e0] hover:border-[#0075de] transition shadow-sm"
              >
                {darkMode ? <Icons.Sun /> : <Icons.Moon />}
                <span>{darkMode ? "Dark Mode Active" : "Daylight Mode Active"}</span>
              </button>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Backend Server Status</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">FastAPI ASGI Server at 127.0.0.1:8000</div>
              </div>
              <span className="text-xs font-mono px-3 py-1 rounded-full bg-[#eef9f1] dark:bg-[#1aae39]/15 text-[#1aae39] border border-[#c6eed0] dark:border-[#1aae39]/30 font-bold">
                {status}
              </span>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Prompt Injection Guard</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">Blocks adversarial system prompt overrides and DAN jailbreaks</div>
              </div>
              <span className="text-xs font-mono px-3 py-1 rounded-full bg-[#eef6fc] dark:bg-[#0075de]/15 text-[#0075de] border border-[#c5e1fb] dark:border-[#0075de]/30 font-semibold">
                ACTIVE
              </span>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Sensitive Data Filter (PII Redaction)</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">Auto-masks emails, phone numbers, and API keys</div>
              </div>
              <span className="text-xs font-mono px-3 py-1 rounded-full bg-[#eef6fc] dark:bg-[#0075de]/15 text-[#0075de] border border-[#c5e1fb] dark:border-[#0075de]/30 font-semibold">
                ACTIVE
              </span>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Anti-Hallucination Rejection Threshold</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">Minimum cosine similarity to prevent out-of-scope answers</div>
              </div>
              <span className="text-xs font-mono px-3 py-1 rounded-full bg-[#f6f5f4] dark:bg-[#191919] text-[#31302e] dark:text-[#d4d4d4] border border-[#e6e6e6] dark:border-[#2f2f2f] font-bold">
                0.40 COSINE
              </span>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">API Rate Limiting</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">Sliding window throttling for server stability</div>
              </div>
              <span className="text-xs font-mono px-3 py-1 rounded-full bg-[#f6f5f4] dark:bg-[#191919] text-[#31302e] dark:text-[#d4d4d4] border border-[#e6e6e6] dark:border-[#2f2f2f] font-bold">
                120 REQ / MIN
              </span>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Neural Question Classifier</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">PyTorch MLP with 3-class Softmax (Python, AI, ML)</div>
              </div>
              <span className="text-xs font-mono px-3 py-1 rounded-full bg-[#f8f2fd] dark:bg-[#d6b6f6]/15 text-[#391c57] dark:text-[#d6b6f6] border border-[#ecdcfc] dark:border-[#d6b6f6]/30 font-bold">
                96.15% TEST ACC
              </span>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Dense Vector Embedding Model</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">Pretrained Transformer (384-dimensional dense vectors)</div>
              </div>
              <span className="text-xs font-mono px-3 py-1 rounded-full bg-[#eef6fc] dark:bg-[#0075de]/15 text-[#0075de] border border-[#c5e1fb] dark:border-[#0075de]/30 font-semibold">
                all-MiniLM-L6-v2
              </span>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Vector Database Index</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">FAISS IndexFlatIP (Inner Product on L2-normalized vectors)</div>
              </div>
              <span className="text-xs font-mono px-3 py-1 rounded-full bg-[#fff0f9] dark:bg-[#ff64c8]/15 text-[#ff64c8] border border-[#ffd1f0] dark:border-[#ff64c8]/30 font-semibold">
                FAISS FlatIP
              </span>
            </div>

            <div className="p-4 flex justify-between items-center">
              <div>
                <div className="text-xs font-semibold text-[#000000] dark:text-[#ffffff]">Relational Database & Chat Memory</div>
                <div className="text-xs text-[#615d59] dark:text-[#888888]">
                  {status?.database_engine === "mysql"
                    ? "MySQL database (XAMPP / Server 8.0) with live sync to chat_memory.json"
                    : "SQLite 3 database (automatic fallback) with live sync to chat_memory.json"}
                </div>
              </div>
              <span className={`text-xs font-mono px-3 py-1 rounded-full font-semibold border ${
                status?.database_engine === "mysql"
                  ? "bg-[#ecfbf2] dark:bg-[#1aae39]/15 text-[#1aae39] border-[#c4f2d2] dark:border-[#1aae39]/30"
                  : "bg-[#fef4ec] dark:bg-[#dd5b00]/15 text-[#dd5b00] border-[#fcdcc4] dark:border-[#dd5b00]/30"
              }`}>
                {status?.database_engine === "mysql" ? "MySQL" : "SQLite 3"}
              </span>
            </div>
          </div>
        </div>
      );
    }

    // Mount the Application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
