<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Study Assistant - Student Knowledge Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .tracking-display {
      letter-spacing: -1.8px;
    }
    .tracking-heading {
      letter-spacing: -0.8px;
    }
    .notion-shadow-sm {
      box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
    }
    .notion-shadow {
      box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03), 0 4px 16px rgba(0,0,0,0.03);
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body className="bg-[#f6f5f4] dark:bg-[#191919] text-[#000000] dark:text-[#ffffff] min-h-screen selection:bg-[#0075de]/15 selection:text-[#0075de] transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = (window.location.protocol === "http:" || window.location.protocol === "https:") ? "" : "http://127.0.0.1:8000";

    // Error Formatter
    function formatErrorDetail(err, fallback = "Request failed") {
      if (!err) return fallback;
      const detail = err.detail !== undefined ? err.detail : err;
      if (typeof detail === "string") return detail;
      if (Array.isArray(detail)) {
        return detail.map(d => d.msg || JSON.stringify(d)).join(", ");
      }
      if (typeof detail === "object") {
        return JSON.stringify(detail);
      }
      return String(detail) || fallback;
    }

    // Clean Minimalist SVG Icons (Strictly Zero Emojis)
    const Icons = {
      Dashboard: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
      ),
      Chat: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
      ),
      Classifier: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
      ),
      Documents: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
      ),
      Summarizer: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h10M4 18h7" /></svg>
      ),
      Quiz: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
      ),
      Agent: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
      ),
      Settings: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
      ),
      Sun: () => (
        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      ),
      Moon: () => (
        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      ),
      Flashcards: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
      ),
      Mic: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
      ),
      Download: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
      ),
      Heart: ({ filled }) => (
        <svg className={`w-3.5 h-3.5 transition ${filled ? "text-red-500 fill-current" : "text-gray-400 hover:text-red-500"}`} viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      )
    };

    // Inline Markdown Formatter
    function renderInlineMarkdown(str) {
      if (!str) return "";
      const tokens = str.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
      return tokens.map((tok, i) => {
        if (tok.startsWith("**") && tok.endsWith("**") && tok.length > 4) {
          return <strong key={i} className="font-semibold text-[#000000] dark:text-[#ffffff]">{tok.slice(2, -2)}</strong>;
        }
        if (tok.startsWith("`") && tok.endsWith("`") && tok.length > 2) {
          return <code key={i} className="px-1.5 py-0.5 rounded bg-[#f6f5f4] dark:bg-[#191919] border border-[#e6e6e6] dark:border-[#2f2f2f] font-mono text-[#0075de] text-[11px] font-medium">{tok.slice(1, -1)}</code>;
        }
        return <span key={i}>{tok}</span>;
      });
    }

    // Structured Academic Response Formatter (Notion Document Style)
    function FormattedTutorResponse({ text }) {
      if (!text) return null;
      const lines = text.split("\n");
      const elements = [];
      let currentBullets = [];

      const flushBullets = (keyPrefix) => {
        if (currentBullets.length > 0) {
          elements.push(
            <div key={`${keyPrefix}-bullets`} className="my-2 space-y-1.5 pl-1">
              {currentBullets.map((b, bIdx) => (
                <div key={bIdx} className="flex items-start space-x-2 text-xs text-[#31302e] dark:text-[#d4d4d4] leading-relaxed">
                  <span className="text-[#a39e98] dark:text-[#666666] font-mono mt-0.5 shrink-0">•</span>
                  <div className="flex-1">
                    {renderInlineMarkdown(b)}
                  </div>
                </div>
              ))}
            </div>
          );
          currentBullets = [];
        }
      };

      lines.forEach((line, idx) => {
        const trimmed = line.trim();
        if (!trimmed) {
          flushBullets(`f-${idx}`);
          return;
        }

        if (trimmed.startsWith("### Concept Overview") || trimmed.startsWith("### Overview")) {
          flushBullets(`h-${idx}`);
          elements.push(
            <div key={idx} className="mt-4 mb-2 flex items-center space-x-2">
              <span className="px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider rounded-full bg-[#eef6fc] dark:bg-[#0075de]/15 text-[#0075de] border border-[#c5e1fb] dark:border-[#0075de]/30">
                Overview
              </span>
              <span className="font-bold text-[#000000] dark:text-[#ffffff] text-xs tracking-tight">Concept Definition</span>
            </div>
          );
        } else if (trimmed.startsWith("### Key Technical Breakdown") || trimmed.startsWith("### Key Mechanics")) {
          flushBullets(`h-${idx}`);
          elements.push(
            <div key={idx} className="mt-4 mb-2 flex items-center space-x-2">
              <span className="px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider rounded-full bg-[#ecf8f7] dark:bg-[#2a9d99]/15 text-[#2a9d99] border border-[#bdedeb] dark:border-[#2a9d99]/30">
                Mechanics
              </span>
              <span className="font-bold text-[#000000] dark:text-[#ffffff] text-xs tracking-tight">Technical Breakdown</span>
            </div>
          );
        } else if (trimmed.startsWith("### Practical Takeaways") || trimmed.startsWith("### Practical Usage")) {
          flushBullets(`h-${idx}`);
          elements.push(
            <div key={idx} className="mt-4 mb-2 flex items-center space-x-2">
              <span className="px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider rounded-full bg-[#fef4ec] dark:bg-[#dd5b00]/15 text-[#dd5b00] border border-[#fcdcc4] dark:border-[#dd5b00]/30">
                Takeaways
              </span>
              <span className="font-bold text-[#000000] dark:text-[#ffffff] text-xs tracking-tight">Practical Application</span>
            </div>
          );
        } else if (trimmed.startsWith("•") || trimmed.startsWith("-")) {
          currentBullets.push(trimmed.replace(/^[•\-]\s*/, ""));
        } else if (trimmed.startsWith("---")) {
          flushBullets(`hr-${idx}`);
          elements.push(<hr key={idx} className="my-3 border-[#e6e6e6] dark:border-[#2f2f2f]" />);
        } else {
          flushBullets(`p-${idx}`);
          elements.push(
            <p key={idx} className="text-xs text-[#31302e] dark:text-[#d4d4d4] leading-relaxed my-1">
              {renderInlineMarkdown(trimmed)}
            </p>
          );
        }
      });

      flushBullets("final");
      return <div className="space-y-1">{elements}</div>;
    }

    // Main Application Shell
    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [dashboardData, setDashboardData] = useState(null);
      const [systemStatus, setSystemStatus] = useState("Checking...");
      const [loading, setLoading] = useState(true);

      // Dark Mode State & Persistence
      const [darkMode, setDarkMode] = useState(() => {
        try {
          const saved = localStorage.getItem("study_assistant_theme");
          if (saved) return saved === "dark";
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          return false;
        }
      });

      useEffect(() => {
        try {
          if (darkMode) {
            document.documentElement.classList.add("dark");
            localStorage.setItem("study_assistant_theme", "dark");
          } else {
            document.documentElement.classList.remove("dark");
            localStorage.setItem("study_assistant_theme", "light");
          }
        } catch (e) {}
      }, [darkMode]);

      const toggleTheme = () => setDarkMode(prev => !prev);

      const fetchDashboardSummary = async () => {
        try {
          const res = await fetch(`${API_BASE}/dashboard/summary`);
          if (res.ok) {
            const data = await res.json();
            setDashboardData(data);
            setSystemStatus("Online");
          } else {
            setSystemStatus("Degraded");
          }
        } catch (e) {
          console.error("Dashboard fetch error", e);
          setSystemStatus("Disconnected");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDashboardSummary();
        const timer = setInterval(fetchDashboardSummary, 12000);
        return () => clearInterval(timer);
      }, []);

      const navItems = [
        { id: "dashboard", label: "Dashboard", icon: Icons.Dashboard, badge: "Home", badgeColor: "bg-[#eef6fc] dark:bg-[#0075de]/15 text-[#0075de]" },
        { id: "chat", label: "Study Chat", icon: Icons.Chat, badge: "Chat", badgeColor: "bg-[#ecf8f7] dark:bg-[#2a9d99]/15 text-[#2a9d99]" },
        { id: "classify", label: "Subject Classifier", icon: Icons.Classifier, badge: "Topics", badgeColor: "bg-[#f8f2fd] dark:bg-[#d6b6f6]/15 text-[#391c57] dark:text-[#d6b6f6]" },
        { id: "documents", label: "My Study Notes", icon: Icons.Documents, badge: "Notes", badgeColor: "bg-[#fff0f9] dark:bg-[#ff64c8]/15 text-[#ff64c8]" },
        { id: "summarizer", label: "Chapter Summarizer", icon: Icons.Summarizer, badge: "Summary", badgeColor: "bg-[#fef4ec] dark:bg-[#dd5b00]/15 text-[#dd5b00]" },
        { id: "quiz", label: "Practice Quiz", icon: Icons.Quiz, badge: "Quiz", badgeColor: "bg-[#eef9f1] dark:bg-[#1aae39]/15 text-[#1aae39]" },
        { id: "flashcards", label: "3D Flashcards", icon: Icons.Flashcards, badge: "Recall", badgeColor: "bg-[#fef4ec] dark:bg-[#dd5b00]/15 text-[#dd5b00]" },
        { id: "agent", label: "Smart Assistant", icon: Icons.Agent, badge: "Agent", badgeColor: "bg-[#eef6fc] dark:bg-[#0075de]/15 text-[#0075de]" },
        { id: "settings", label: "System Health", icon: Icons.Settings, badge: "Status", badgeColor: "bg-[#f6f5f4] dark:bg-[#2a2a2a] text-[#615d59] dark:text-[#a39e98]" }
      ];

      return (
        <div className="flex h-screen overflow-hidden bg-[#f6f5f4] dark:bg-[#191919] transition-colors duration-200">
          {/* Left Sidebar (Notion Clean Desk Style) */}
          <aside className="w-64 bg-[#ffffff] dark:bg-[#202020] border-r border-[#e6e6e6] dark:border-[#2f2f2f] flex flex-col justify-between select-none shrink-0 shadow-sm z-20 transition-colors duration-200">
            <div className="flex-1 flex flex-col min-h-0">
              {/* App Brand & Dark Mode Button */}
              <div className="p-3 sm:p-3.5 border-b border-[#e6e6e6] dark:border-[#2f2f2f] flex items-center justify-between shrink-0">
                <div className="flex items-center space-x-3">
                  <div className="h-8 w-8 rounded-lg bg-[#0075de] flex items-center justify-center font-bold text-white text-xs tracking-wider shadow-sm">
                    AI
                  </div>
                  <div>
                    <h1 className="text-xs font-bold text-[#000000] dark:text-[#ffffff] tracking-tight uppercase font-mono">Study Assistant</h1>
                    <span className="text-[10px] text-[#615d59] dark:text-[#a39e98] block">Student Portal</span>
                  </div>
                </div>

                {/* Dark Mode Toggle Button */}
                <button
                  onClick={toggleTheme}
                  title={darkMode ? "Switch to Daylight Mode" : "Switch to Dark Mode"}
                  className="p-1.5 rounded-lg border border-[#e6e6e6] dark:border-[#383838] bg-[#f6f5f4] dark:bg-[#2a2a2a] text-[#615d59] dark:text-[#e0e0e0] hover:text-[#0075de] dark:hover:text-[#62aef0] transition shadow-sm"
                >
                  {darkMode ? <Icons.Sun /> : <Icons.Moon />}
                </button>
              </div>

              {/* Navigation Menu */}
              <nav className="p-2 space-y-0.5 overflow-y-auto flex-1">
                {navItems.map(item => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-medium transition ${
                        isActive
                          ? "bg-[#f6f5f4] dark:bg-[#2a2a2a] text-[#0075de] dark:text-[#62aef0] font-semibold shadow-sm border border-[#e6e6e6] dark:border-[#383838]"
                          : "text-[#31302e] dark:text-[#d4d4d4] hover:bg-[#f6f5f4] dark:hover:bg-[#262626] hover:text-[#000000] dark:hover:text-[#ffffff]"
                      }`}
                    >
                      <div className="flex items-center space-x-2.5">
                        <span className={isActive ? "text-[#0075de] dark:text-[#62aef0]" : "text-[#615d59] dark:text-[#888888]"}>
                          <Icon />
                        </span>
                        <span>{item.label}</span>
                      </div>
                      <span className={`text-[9px] font-mono font-semibold px-1.5 py-0.5 rounded-full border border-black/5 dark:border-white/5 ${
                        isActive ? "bg-[#0075de] text-white" : item.badgeColor
                      }`}>
                        {item.badge}
                      </span>
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Sidebar Footer with Live API Pill */}
            <div className="p-2.5 sm:p-3 border-t border-[#e6e6e6] dark:border-[#2f2f2f] bg-[#fdfdfd] dark:bg-[#1d1d1d] text-xs shrink-0">
              <div className="flex items-center justify-between font-mono text-[11px]">
                <span className="text-[#615d59] dark:text-[#888888]">Backend API:</span>
                <span className="inline-flex items-center space-x-1.5 font-semibold text-[#1aae39]">
                  <span className={`h-2 w-2 rounded-full ${
                    systemStatus === "Online" ? "bg-[#1aae39] animate-pulse" : "bg-[#dd5b00]"
                  }`}></span>
                  <span>{systemStatus}</span>
                </span>
              </div>
              <div className="mt-1 text-[10px] font-mono text-[#a39e98] dark:text-[#666666] flex justify-between">
                <span>FastAPI 0.115 ASGI</span>
                <span>127.0.0.1:8000</span>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className={`flex-1 ${activeTab === 'chat' ? 'overflow-hidden p-2.5 sm:p-3 md:p-4 flex flex-col' : 'overflow-y-auto p-3 sm:p-4 md:p-6'} bg-[#f6f5f4] dark:bg-[#191919] transition-colors duration-200`}>
            {activeTab === "dashboard" && (
              <DashboardView
                data={dashboardData}
                loading={loading}
                onNavigate={setActiveTab}
                onRefresh={fetchDashboardSummary}
              />
            )}
            {activeTab === "chat" && <AIChatView onRefreshMetrics={fetchDashboardSummary} />}
            {activeTab === "classify" && <ClassifierView />}
            {activeTab === "documents" && <DocumentsView onUploaded={fetchDashboardSummary} />}
            {activeTab === "summarizer" && <SummarizerView />}
            {activeTab === "quiz" && <QuizView onRefreshMetrics={fetchDashboardSummary} />}
            {activeTab === "flashcards" && <FlashcardsView />}
            {activeTab === "agent" && <AgentView onRefreshMetrics={fetchDashboardSummary} />}
            {activeTab === "settings" && <SettingsView status={systemStatus} darkMode={darkMode} onToggleTheme={toggleTheme} />}
          </main>
        </div>
      );
    }

    // ==========================================
    // 1. NOTION DASHBOARD VIEW
    // ==========================================
    function DashboardView({ data, loading, onNavigate, onRefresh }) {
      const [quickQuery, setQuickQuery] = useState("");
      const [quickAnswer, setQuickAnswer] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      const metrics = data?.metrics || {
        total_documents: 1,
        total_questions_asked: 0,
        total_quizzes_generated: 0,
        average_quiz_score: 0.0,
        total_chunks_indexed: 13
      };

      const handleQuickSubmit = async (e) => {
        e.preventDefault();
        if (!quickQuery.trim() || submitting) return;
        setSubmitting(true);
        setQuickAnswer(null);

        try {
          const res = await fetch(`${API_BASE}/ask`, {

              <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl p-5 notion-shadow-sm transition-colors">
                <div className="flex items-center justify-between pb-3 border-b border-[#e6e6e6] dark:border-[#2f2f2f]">
                  <span className="text-xs uppercase font-mono font-bold tracking-wider text-[#615d59] dark:text-[#888888]">Indexed Notes</span>
                  <button onClick={() => onNavigate("documents")} className="text-xs text-[#0075de] hover:underline font-medium">
                    Upload +
                  </button>
                </div>

                <div className="mt-3 divide-y divide-[#e6e6e6] dark:divide-[#2f2f2f]">
                  {data?.documents && data.documents.length > 0 ? (
                    data.documents.map((doc, idx) => (
                      <div key={idx} className="py-2.5 flex items-center justify-between text-xs">
                        <div>
                          <div className="font-semibold text-[#000000] dark:text-[#ffffff] truncate max-w-[160px]">{doc.filename}</div>
                          <div className="text-[10px] font-mono text-[#615d59] dark:text-[#888888]">
                            {doc.file_type} • {doc.chunks_count} Chunks
                          </div>
                        </div>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-[#eef9f1] dark:bg-[#1aae39]/15 text-[#1aae39] border border-[#c6eed0] dark:border-[#1aae39]/30 font-semibold">
                          Active
                        </span>
                      </div>
                    ))
                  ) : (
                    <div className="text-xs text-[#a39e98] dark:text-[#666666] font-mono py-4 text-center">
                      No documents found.
                    </div>
                  )}
                </div>
              </div>

              {/* Recent Quiz Scores */}
              <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl p-5 notion-shadow-sm transition-colors">
                <div className="flex items-center justify-between pb-3 border-b border-[#e6e6e6] dark:border-[#2f2f2f]">
                  <span className="text-xs uppercase font-mono font-bold tracking-wider text-[#615d59] dark:text-[#888888]">Recent Quiz Scores</span>
                  <button onClick={() => onNavigate("quiz")} className="text-xs text-[#dd5b00] hover:underline font-medium">
                    New Quiz →
                  </button>
                </div>

                <div className="mt-3 space-y-2">
                  {data?.recent_quizzes && data.recent_quizzes.length > 0 ? (
                    data.recent_quizzes.map((q, idx) => (
                      <div key={idx} className="p-2.5 bg-[#f6f5f4] dark:bg-[#191919] rounded-lg border border-[#e6e6e6] dark:border-[#2f2f2f] flex items-center justify-between text-xs">
                        <div>
                          <div className="font-semibold text-[#000000] dark:text-[#ffffff]">{q.topic}</div>
                          <div className="text-[10px] font-mono text-[#615d59] dark:text-[#888888]">
                            {q.score} / {q.total_questions} Questions
                          </div>
                        </div>
                        <span className={`font-mono font-bold text-xs px-2 py-0.5 rounded-full border ${
                          q.percentage >= 80 ? "bg-[#eef9f1] dark:bg-[#1aae39]/15 text-[#1aae39] border-[#c6eed0] dark:border-[#1aae39]/30" : "bg-[#fef4ec] dark:bg-[#dd5b00]/15 text-[#dd5b00] border-[#fcdcc4] dark:border-[#dd5b00]/30"
                        }`}>
                          {q.percentage}%
                        </span>
                      </div>
                    ))
                  ) : (
                    <div className="p-4 bg-[#f6f5f4] dark:bg-[#191919] rounded-lg border border-[#e6e6e6] dark:border-[#2f2f2f] text-center text-xs font-mono text-[#a39e98] dark:text-[#666666]">
                      <p>No practice quizzes submitted yet.</p>
                      <button
                        onClick={() => onNavigate("quiz")}
                        className="text-[#0075de] hover:underline mt-1.5 block text-xs font-sans font-medium"
                      >
                        Start your first quiz
                      </button>
                    </div>
                  )}
                </div>
              </div>

              {/* Technical System Specs Card */}
              <div className="bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl p-4 text-xs font-mono space-y-2 text-[#615d59] dark:text-[#888888] notion-shadow-sm transition-colors">
                <div className="text-[#000000] dark:text-[#ffffff] font-bold uppercase text-[11px] mb-1">Architecture Specs</div>
                <div className="flex justify-between">
                  <span>Backend:</span>
                  <span className="text-[#000000] dark:text-[#ffffff]">FastAPI 0.115</span>
                </div>
                <div className="flex justify-between">
                  <span>Inference:</span>
                  <span className="text-[#000000] dark:text-[#ffffff]">PyTorch + Transformers</span>
                </div>
                <div className="flex justify-between">
                  <span>Vector Index:</span>
                  <span className="text-[#000000] dark:text-[#ffffff]">FAISS FlatIP</span>
                </div>
                <div className="flex justify-between">
                  <span>Security:</span>
                  <span className="text-[#1aae39] font-semibold">Active Guardrails</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. NOTION AI CHAT & RAG VIEW
    // ==========================================
    function AIChatView({ onRefreshMetrics }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [copiedIdx, setCopiedIdx] = useState(null);
      const [loadingHistory, setLoadingHistory] = useState(true);
      const [isListening, setIsListening] = useState(false);
      const [lastQuery, setLastQuery] = useState("");
      const [savedCards, setSavedCards] = useState([]);
      const recognitionRef = useRef(null);

      const loadSavedCards = async () => {
        try {
          const res = await fetch(`${API_BASE}/flashcards?topic=Saved`);
          if (res.ok) {
            const data = await res.json();
            setSavedCards(data || []);
          }
        } catch (e) {
          console.error("Failed to load saved recall cards", e);
        }
      };

      useEffect(() => {
        loadSavedCards();
      }, []);

      const isFavorite = (m) => {
        const q = (m.question || lastQuery || "").trim().toLowerCase();
        return savedCards.some(sc => (sc.front || "").trim().toLowerCase() === q || sc.back === m.text);
      };

      const handleToggleFavorite = async (m) => {
        const q = (m.question || lastQuery || "").trim();
        if (!q) return;

        const existing = savedCards.find(sc => (sc.front || "").trim().toLowerCase() === q.toLowerCase() || sc.back === m.text);

        if (existing) {
          try {
            const res = await fetch(`${API_BASE}/flashcards/saved/${existing.id}`, { method: "DELETE" });
            if (res.ok) {
              setSavedCards(prev => prev.filter(sc => sc.id !== existing.id));
            }
          } catch (e) {
            console.error(e);
          }
        } else {
          try {
            const res = await fetch(`${API_BASE}/flashcards/saved`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                front: q,
                back: m.text,
                topic: m.is_web ? "Web Knowledge" : "Study Notes",
                source: m.is_web ? (m.provider || "Gemini Web") : "Uploaded Notes"
              })
            });
            if (res.ok) {
              const data = await res.json();
              setSavedCards(prev => [...prev, {
                id: data.id,
                front: q,
                back: m.text,
                topic: m.is_web ? "Web Knowledge" : "Study Notes",
                source: m.is_web ? (m.provider || "Gemini Web") : "Uploaded Notes",
                is_saved: true
              }]);
            }
          } catch (e) {
            console.error(e);
          }
        }
      };

      const handleAskWeb = async (queryText) => {
        const queryToAsk = (queryText || lastQuery || "").trim();
        if (!queryToAsk || loading) return;
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/ask-web`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: queryToAsk })
          });
          if (res.ok) {
            const data = await res.json();
            setMessages(prev => [...prev, {
              role: "assistant",
              question: queryToAsk,
              text: data.answer,
              citations: data.citations,
              found_in_notes: false,
              is_web: true,
              provider: data.provider,
              confidence: 1.0,
              timestamp: new Date().toISOString()
            }]);
            onRefreshMetrics();
          } else {
            const errData = await res.json().catch(() => ({}));
            setMessages(prev => [...prev, {
              role: "assistant",
              question: queryToAsk,
              text: `External AI request could not be completed: ${errData.detail || "Server error"}. You can ask again or check server connection.`,
              found_in_notes: false,
              timestamp: new Date().toISOString()
            }]);
          }
        } catch (err) {
          console.error("Web search failed", err);
          setMessages(prev => [...prev, {
            role: "assistant",
            question: queryToAsk,
            text: `Connection to Web Knowledge was interrupted: ${err.message}. Please verify the backend server is active at http://127.0.0.1:8000 and try again.`,
            found_in_notes: false,
            timestamp: new Date().toISOString()
          }]);
        } finally {
          setLoading(false);
        }
      };

      const toggleVoiceInput = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Voice recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
          return;
        }
        if (isListening) {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch(e) {}
          }
          setIsListening(false);
          return;
        }
        try {
          const recognition = new SpeechRecognition();
          recognitionRef.current = recognition;
          recognition.lang = "en-IN";
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;
          recognition.onstart = () => setIsListening(true);
          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setInput(prev => (prev ? prev + " " + transcript : transcript));
            setIsListening(false);
          };
          recognition.onerror = (event) => {
            console.error("Speech error", event);
            setIsListening(false);
          };
          recognition.onend = () => {
            setIsListening(false);
            recognitionRef.current = null;
          };
          recognition.start();
        } catch (e) {
          console.error("Speech recognition start failed", e);
          setIsListening(false);
        }
      };

      const handleExportNotes = () => {
        if (!messages || messages.length === 0) {
          alert("No study session notes to export.");
          return;
        }
        let md = `# AI Study Assistant - Session Study Notes\nGenerated on: ${new Date().toLocaleString()}\n\n---\n\n`;
        messages.forEach((m, i) => {
          if (m.role === "user") {
            md += `### Question: ${m.text}\n\n`;
          } else {
            md += `**Answer:**\n${m.text}\n\n`;
            if (m.confidence !== undefined) {
              md += `*Confidence Score: ${(m.confidence * 100).toFixed(1)}% | Grounded in Notes: ${m.found_in_notes ? "Yes" : "No"}*\n\n`;
            }
            if (m.citations && m.citations.length > 0) {
              md += `*Citations:*\n`;
              m.citations.forEach(c => {
                md += `- ${c.document_name} (Page ${c.page_number}, Score: ${c.relevance_score})\n`;
              });
              md += `\n`;
            }
            md += `---\n\n`;
          }
        });
        const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `AI_Study_Notes_${new Date().toISOString().slice(0, 10)}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const starterQuestions = [
        "What is MongoDB and what are mongod and mongosh?",
        "What is the Global Interpreter Lock in Python?",
        "How do Python generator functions work with yield?",
        "Explain L1 vs L2 regularization techniques",
        "In A* heuristic search, what does h(n) represent?"
      ];

      const loadHistory = async () => {
        try {
          const res = await fetch(`${API_BASE}/history?limit=30`);
          if (res.ok) {
            const raw = await res.json();
            if (raw && raw.length > 0) {
              const formatted = [];
              const sorted = [...raw].reverse();
              sorted.forEach(item => {
                formatted.push({
                  role: "user",
                  text: item.query,
                  timestamp: item.timestamp
                });
                formatted.push({
                  role: "assistant",
                  question: item.query,
                  text: item.answer,
                  confidence: item.confidence,
                  tool_used: item.tool_used,
                  found_in_notes: item.confidence >= 0.40,
                  timestamp: item.timestamp
                });
              });
              setMessages(formatted);
            } else {
              setMessages([
                {
                  role: "assistant",
                  text: "Hello! I am your AI Study Tutor. Ask any conceptual or technical question grounded in your uploaded study notes (e.g. GIL in Python, L1/L2 regularization, or A* search)."
                }
              ]);
            }
          }
        } catch (e) {
          console.error("Failed to load history", e);
        } finally {
          setLoadingHistory(false);
        }
      };

      useEffect(() => {
        loadHistory();
      }, []);

      const handleSend = async (queryText) => {
        const queryToSend = queryText || input;
        if (!queryToSend.trim() || loading) return;

        const userMsg = queryToSend.trim();
        setLastQuery(userMsg);
        setInput("");
        setMessages(prev => [...prev, {
          role: "user",
          text: userMsg,
          timestamp: new Date().toISOString()
        }]);
        setLoading(true);

        try {
          const res = await fetch(`${API_BASE}/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: userMsg })
          });

          if (!res.ok) {
            const err = await res.json();
            setMessages(prev => [...prev, {
              role: "assistant",
              text: `Error: ${formatErrorDetail(err, "Query failed")}`
            }]);
          } else {
            const data = await res.json();
            setMessages(prev => [...prev, {
              role: "assistant",
              question: userMsg,
              text: data.answer,
              citations: data.citations,
              found_in_notes: data.found_in_notes,
              confidence: data.confidence,
              retrieved_count: data.retrieved_count,
              timestamp: new Date().toISOString()
            }]);
            onRefreshMetrics();
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            role: "assistant",
            text: `Connection error: ${err.message}`,
            found_in_notes: false
          }]);
        } finally {
          setLoading(false);
        }
      };

      const handleClearHistory = async () => {
        if (!confirm("Clear full conversation history from database?")) return;
        try {
          const res = await fetch(`${API_BASE}/history`, { method: "DELETE" });
          if (res.ok) {
            setMessages([
              {
                role: "assistant",
                text: "Chat history cleared. What would you like to study next?"
              }
            ]);
            onRefreshMetrics();
          }
        } catch (e) {
          alert("Clear failed: " + e.message);
        }
      };

      const handleCopy = (text, idx) => {
        navigator.clipboard.writeText(text);
        setCopiedIdx(idx);
        setTimeout(() => setCopiedIdx(null), 2000);
      };

      return (
        <div className="max-w-5xl w-full mx-auto flex flex-col flex-1 min-h-0 space-y-2.5">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-[#e6e6e6] dark:border-[#2f2f2f] shrink-0">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-[#000000] dark:text-[#ffffff] tracking-heading">Chat With Your Study Notes</h2>
              <p className="text-xs text-[#615d59] dark:text-[#888888] mt-0.5">Retrieval-Augmented Generation (RAG) with anti-hallucination guardrail (0.40 threshold).</p>
            </div>
            <div className="flex items-center space-x-2 text-xs font-mono">
              <span className="px-3 py-1 rounded-full bg-[#eef6fc] dark:bg-[#0075de]/15 border border-[#c5e1fb] dark:border-[#0075de]/30 text-[#0075de] font-semibold">
                Smart Notes Search
              </span>
              <button
                onClick={handleExportNotes}
                className="px-3 py-1 rounded-md bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border border-[#c5e1fb] dark:border-[#0075de]/30 text-[#0075de] dark:text-[#62aef0] transition text-xs font-sans flex items-center space-x-1 shadow-sm"
                title="Download formatted Markdown study guide of conversation"
              >
                <Icons.Download />
                <span>Export Notes (.md)</span>
              </button>
              <button
                onClick={handleClearHistory}
                className="px-3 py-1 rounded-md bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border border-[#e6e6e6] dark:border-[#2f2f2f] text-[#615d59] dark:text-[#888888] hover:text-[#000000] dark:hover:text-[#ffffff] transition text-xs font-sans"
              >
                Clear History
              </button>
            </div>
          </div>

          {/* Starter Chips Bar */}
          <div className="flex items-center space-x-2 overflow-x-auto pb-1 text-xs font-mono text-[#615d59] dark:text-[#888888] select-none shrink-0">
            <span className="text-[#a39e98] dark:text-[#666666] shrink-0 text-xs">Sample Questions:</span>
            {starterQuestions.map((q, idx) => (
              <button
                key={idx}
                onClick={() => handleSend(q)}
                disabled={loading}
                className="shrink-0 px-3 py-1 rounded-full bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border border-[#e6e6e6] dark:border-[#2f2f2f] hover:border-[#0075de] text-[#31302e] dark:text-[#d4d4d4] hover:text-[#0075de] dark:hover:text-[#62aef0] transition text-[11px] font-sans shadow-sm"
              >
                {q}
              </button>
            ))}
          </div>

          {/* Message Stream */}
          <div className="flex-1 min-h-0 bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-xl p-3 sm:p-4 overflow-y-auto space-y-3 notion-shadow-sm transition-colors">
            {loadingHistory ? (
              <div className="p-8 text-center text-xs font-mono text-[#0075de]">
                Loading persistent study conversations from SQLite...
              </div>
            ) : (
              messages.map((m, idx) => (
                <div key={idx} className={`flex flex-col ${m.role === "user" ? "items-end" : "items-start"}`}>
                  <div className={`max-w-3xl sm:max-w-3xl lg:max-w-4xl p-3 sm:p-3.5 rounded-xl text-xs ${
                    m.role === "user"
                      ? "bg-[#0075de] text-white rounded-br-none shadow-sm"
                      : "bg-[#f6f5f4] dark:bg-[#191919] text-[#000000] dark:text-[#ffffff] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-bl-none shadow-sm"
                  }`}>
                    {/* Role Header */}
                    <div className={`flex items-center justify-between text-[11px] font-mono mb-2 pb-1.5 border-b ${
                      m.role === "user" ? "border-white/20 text-white/80" : "border-[#e6e6e6] dark:border-[#2f2f2f] text-[#615d59] dark:text-[#888888]"
                    }`}>
                      <span className="font-semibold uppercase tracking-wider">
                        {m.role === "user" ? "You (Student)" : (m.is_web ? "AI Web Tutor" : "AI Study Tutor")}
                      </span>
                      {m.timestamp && (
                        <span>{new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                      )}
                    </div>

                    {/* Verified In Notes Header Banner */}
                    {m.role === "assistant" && m.found_in_notes && m.citations && m.citations.length > 0 && (
                      <div className="mb-2.5 pb-2 border-b border-[#e6e6e6] dark:border-[#2f2f2f] flex items-center justify-between flex-wrap gap-2 text-[11px] font-mono">
                        <div className="flex items-center space-x-1.5 text-[#1aae39] font-semibold">
                          <span className="h-2 w-2 rounded-full bg-[#1aae39]"></span>
                          <span>Verified in Study Notes:</span>
                          <span className="font-bold underline text-[#0075de]">{m.citations[0].document_name}</span>
                          <span className="bg-[#eef9f1] dark:bg-[#1aae39]/15 px-1.5 py-0.2 rounded border border-[#c6eed0] dark:border-[#1aae39]/30">Page {m.citations[0].page_number}</span>
                        </div>
                        <span className="text-[#615d59] dark:text-[#888888]">
                          Match: {(m.citations[0].relevance_score * 100).toFixed(1)}%
                        </span>
                      </div>
                    )}

                    {/* Web / External AI Header Banner */}
                    {m.role === "assistant" && m.is_web && (
                      <div className="mb-2.5 pb-2 border-b border-[#e6e6e6] dark:border-[#2f2f2f] flex items-center justify-between text-[11px] font-mono text-[#0075de]">
                        <div className="flex items-center space-x-1.5 font-semibold">
                          <span className="h-2 w-2 rounded-full bg-[#0075de]"></span>
                          <span>Global Web & AI Knowledge ({m.provider || "External AI"})</span>
                        </div>
                        <span className="text-[#615d59] dark:text-[#888888]">Out-of-Notes Search</span>
                      </div>
                    )}

                    <div className="leading-relaxed font-sans text-xs">
                      {m.role === "user" ? (
                        <p>{m.text}</p>
                      ) : (
                        <FormattedTutorResponse text={m.text} />
                      )}
                    </div>

                    {/* Out of Notes Action Card: Continue to Web / Ask AI */}
                    {m.role === "assistant" && !m.found_in_notes && !m.is_web && (
                      <div className="mt-2.5 p-2.5 bg-[#eef6fc] dark:bg-[#0075de]/10 border border-[#c5e1fb] dark:border-[#0075de]/30 rounded-lg flex flex-col sm:flex-row sm:items-center justify-between gap-2 font-sans">
                        <div>
                          <div className="font-semibold text-[#0075de] text-xs">Topic not found in your study notes</div>
                          <div className="text-[11px] text-[#615d59] dark:text-[#888888]">Would you like to search via Web & External AI?</div>
                        </div>
                        <button
                          type="button"
                          onClick={() => handleAskWeb(m.question || lastQuery)}
                          disabled={loading}
                          className="px-3 py-1 bg-[#0075de] hover:bg-[#005fb2] text-white text-xs font-semibold rounded-md shadow-sm transition whitespace-nowrap cursor-pointer"
                        >
                          Continue to Web / Ask AI
                        </button>
                      </div>
                    )}

                    {/* In-Notes Deeper Explanation Action Card */}
                    {m.role === "assistant" && m.found_in_notes && !m.is_web && (
                      <div className="mt-2.5 p-2.5 bg-[#f6f5f4] dark:bg-[#191919] border border-[#e6e6e6] dark:border-[#2f2f2f] rounded-lg flex flex-col sm:flex-row sm:items-center justify-between gap-2 font-sans">
                        <div>
                          <div className="font-semibold text-[#0075de] dark:text-[#62aef0] text-xs">Need a simpler or deeper explanation?</div>
                          <div className="text-[11px] text-[#615d59] dark:text-[#888888]">Ask Gemini AI for beginner analogies, practical code, and step-by-step breakdown.</div>
                        </div>
                        <button
                          type="button"
                          onClick={() => handleAskWeb(m.question || lastQuery)}
                          disabled={loading}

    // ==========================================
    // 4. NOTION DOCUMENTS & VECTOR STORE VIEW
    // ==========================================
    function DocumentsView({ onUploaded }) {
      const [documents, setDocuments] = useState([]);
      const [uploading, setUploading] = useState(false);
      const [uploadStage, setUploadStage] = useState("");
      const [statusMsg, setStatusMsg] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [inspectDoc, setInspectDoc] = useState(null);
      const [docChunks, setDocChunks] = useState([]);
      const [loadingChunks, setLoadingChunks] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");

      const loadDocuments = async () => {
        try {
          const res = await fetch(`${API_BASE}/documents`);
          if (res.ok) {
            const data = await res.json();
            setDocuments(data);
          }
        } catch (e) {
          console.error("Failed to load documents", e);
        }
      };

      useEffect(() => {
        loadDocuments();
      }, []);

      const processFile = async (file) => {
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext !== 'pdf' && ext !== 'txt') {
          setStatusMsg({ type: 'error', text: `Unsupported format .${ext}. Only .pdf and .txt files are supported.` });
          return;
        }

        if (file.size > 15 * 1024 * 1024) {
          setStatusMsg({ type: 'error', text: "File size exceeds 15MB limit." });
          return;
        }

        setUploading(true);
        setStatusMsg(null);
        setUploadStage("1/4: Ingesting file stream...");

        setTimeout(() => setUploadStage("2/4: Extracting text & sliding-window chunking (400 chars, 60 overlap)..."), 700);
        setTimeout(() => setUploadStage("3/4: Generating 384-d dense embeddings (all-MiniLM-L6-v2)..."), 1800);
        setTimeout(() => setUploadStage("4/4: Indexing notes into search library..."), 2900);

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch(`${API_BASE}/upload`, {
            method: "POST",
            body: formData
          });

          if (!res.ok) {
            const err = await res.json();
            setStatusMsg({ type: 'error', text: `Upload failed: ${formatErrorDetail(err, "Server error")}` });
          } else {
            const data = await res.json();
            setStatusMsg({
              type: 'success',
              text: `Indexed '${data.document_name}': ${data.chunks_created} chunks added. Total FAISS vectors: ${data.total_indexed_chunks}`
            });
            loadDocuments();
            onUploaded();
          }
        } catch (err) {
          setStatusMsg({ type: 'error', text: `Network error: ${err.message}` });
        } finally {
          setUploading(false);
          setUploadStage("");
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          processFile(e.dataTransfer.files[0]);
        }
      };

      const handleInspect = async (filename) => {
        setInspectDoc(filename);
        setLoadingChunks(true);
        setDocChunks([]);

        try {
          const res = await fetch(`${API_BASE}/documents/${encodeURIComponent(filename)}/chunks`);
          if (res.ok) {
            const chunks = await res.json();
            setDocChunks(chunks);
          } else {
            alert("Could not load chunks for " + filename);
          }
        } catch (e) {
          alert("Error fetching chunks: " + e.message);
        } finally {
          setLoadingChunks(false);
        }
      };

      const handleDelete = async (filename) => {
        if (!confirm(`Are you sure you want to delete '${filename}'? This will remove its chunks from FAISS vector store and SQLite.`)) return;
        try {
          const res = await fetch(`${API_BASE}/documents/${encodeURIComponent(filename)}`, {
            method: "DELETE"
          });
          if (res.ok) {
            setStatusMsg({ type: 'info', text: `Document '${filename}' deleted from database and vector index.` });
            if (inspectDoc === filename) {
              setInspectDoc(null);
              setDocChunks([]);
            }
            loadDocuments();
            onUploaded();
          } else {
            const err = await res.json();
            alert(`Delete failed: ${formatErrorDetail(err, "Delete failed")}`);
          }
        } catch (e) {
          alert("Delete failed: " + e.message);
        }
      };

      const handleLoadSample = async () => {
        setUploading(true);
        setUploadStage("Re-indexing bundled sample study notes...");
        try {
          const res = await fetch(`${API_BASE}/documents/sample`, { method: "POST" });
          if (res.ok) {
            const data = await res.json();
            setStatusMsg({
              type: 'success',
              text: `Sample notes successfully indexed into FAISS (${data.chunks_created} chunks).`
            });
            loadDocuments();
            onUploaded();
          } else {
            const err = await res.json();
            alert("Failed to load sample: " + formatErrorDetail(err, "Load failed"));
          }
        } catch (e) {
          alert("Sample load error: " + e.message);
        } finally {
          setUploading(false);
          setUploadStage("");
        }
      };

      const filteredDocs = documents.filter(d =>
        d.filename.toLowerCase().includes(searchTerm.toLowerCase()) ||
        d.file_type.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const totalChunksAcrossAll = documents.reduce((acc, d) => acc + (d.chunks_count || 0), 0);

      return (
        <div className="max-w-5xl mx-auto space-y-4 pb-6">
          {/* Header & Stats Bar */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-[#e6e6e6] dark:border-[#2f2f2f]">
            <div>
              <h2 className="text-2xl font-bold text-[#000000] dark:text-[#ffffff] tracking-heading">Study Documents & Notes Library</h2>
              <p className="text-xs text-[#615d59] dark:text-[#888888] mt-1">Upload, organize, and inspect your lecture notes and PDF study material.</p>
            </div>
            <div className="flex items-center space-x-2 text-xs font-mono">
              <span className="px-3 py-1.5 rounded-md bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] text-[#31302e] dark:text-[#d4d4d4]">
                Docs: <strong className="text-[#000000] dark:text-[#ffffff]">{documents.length}</strong>
              </span>
              <span className="px-3 py-1.5 rounded-md bg-[#ffffff] dark:bg-[#202020] border border-[#e6e6e6] dark:border-[#2f2f2f] text-[#31302e] dark:text-[#d4d4d4]">
                Total Chunks: <strong className="text-[#0075de]">{totalChunksAcrossAll}</strong>
              </span>
              <button
                onClick={handleLoadSample}
                disabled={uploading}
                className="px-3 py-1.5 rounded-md bg-[#ffffff] dark:bg-[#202020] hover:bg-[#f6f5f4] dark:hover:bg-[#2a2a2a] border border-[#e6e6e6] dark:border-[#2f2f2f] text-[#0075de] transition font-sans font-medium text-xs disabled:opacity-50"
              >
                Reload Sample Notes
              </button>
            </div>
          </div>

          {/* Drag & Drop Upload Zone */}
          <div
            onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
            onDragLeave={() => setIsDragging(false)}
            onDrop={handleDrop}
            className={`border-2 border-dashed rounded-xl p-8 text-center transition select-none ${
              isDragging
                ? "border-[#0075de] bg-[#eef6fc] dark:bg-[#0075de]/10"
                : "border-[#dddddd] dark:border-[#383838] hover:border-[#0075de] bg-[#ffffff] dark:bg-[#202020]"
            }`}
          >
            <input
              type="file"
              id="filePicker"
              accept=".pdf,.txt"
              onChange={(e) => {
                if (e.target.files && e.target.files.length > 0) {
                  processFile(e.target.files[0]);
                }
              }}
              className="hidden"
              disabled={uploading}
            />

            <label htmlFor="filePicker" className="cursor-pointer block space-y-3">
              <div className="inline-flex p-3 rounded-full bg-[#f6f5f4] dark:bg-[#191919] text-[#0075de] border border-[#e6e6e6] dark:border-[#2f2f2f]">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
              </div>
              <div>
                <span className="text-sm font-bold text-[#000000] dark:text-[#ffffff] block">
                  {uploading ? "Processing Document..." : "Drag and drop PDF or TXT lecture notes here"}

                <span className="text-xs text-[#615d59] dark:text-[#888888] mt-1 block">
                  or <span className="text-[#0075de] underline font-medium">browse computer files</span> (Max 15MB)
                </span>
              </div>
              <div className="flex items-center justify-center space-x-3 text-[11px] font-mono text-[#a39e98] dark:text-[#666666]">
                <span>PDF (PyPDF extracted)</span>
                <span>•</span>
                <span>TXT (UTF-8)</span>
                <span>•</span>
                <span>Sentence Boundary Chunking</span>
              </div>
