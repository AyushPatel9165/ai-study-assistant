    // ==========================================
    // 2. UPGRADED AI CHAT VIEW (RAG Grounded Q&A)
    // ==========================================
    function AIChatView({ onRefreshMetrics }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [copiedIdx, setCopiedIdx] = useState(null);
      const [loadingHistory, setLoadingHistory] = useState(true);

      const starterQuestions = [
        "What is MongoDB and what are mongod and mongosh?",
        "What is the Global Interpreter Lock in Python?",
        "How do Python generator functions work with yield?",
        "Explain L1 vs L2 regularization techniques",
        "In A* heuristic search, what does h(n) represent?"
      ];

      // Load persistent conversation history from SQLite
      const loadHistory = async () => {
        try {
          const res = await fetch(`${API_BASE}/history?limit=30`);
          if (res.ok) {
            const raw = await res.json();
            if (raw && raw.length > 0) {
              const formatted = [];
              // SQLite returns in DESC order, reverse for chronological chat flow
              const sorted = [...raw].reverse();
              sorted.forEach(item => {
                formatted.push({
                  role: "user",
                  text: item.query,
                  timestamp: item.timestamp
                });
                formatted.push({
                  role: "assistant",
                  text: item.answer,
                  confidence: item.confidence,
                  tool_used: item.tool_used,
                  found_in_notes: item.confidence >= 0.35,
                  timestamp: item.timestamp
                });
              });
              setMessages(formatted);
            } else {
              setMessages([
                {
                  role: "assistant",
                  text: "Hello! I am your AI Study Tutor. Ask any conceptual or technical question grounded in your uploaded study notes (e.g. GIL in Python, L1/L2 regularization, or A* search)."
                }
              ]);
            }
          }
        } catch (e) {
          console.error("Failed to load history", e);
        } finally {
          setLoadingHistory(false);
        }
      };

      useEffect(() => {
        loadHistory();
      }, []);

      const handleSend = async (queryText) => {
        const queryToSend = queryText || input;
        if (!queryToSend.trim() || loading) return;

        const userMsg = queryToSend.trim();
        setInput("");
        setMessages(prev => [...prev, {
          role: "user",
          text: userMsg,
          timestamp: new Date().toISOString()
        }]);
        setLoading(true);

        try {
          const res = await fetch(`${API_BASE}/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: userMsg })
          });

          if (!res.ok) {
            const err = await res.json();
            setMessages(prev => [...prev, {
              role: "assistant",
              text: `Error: ${formatErrorDetail(err, "Query failed")}`
            }]);
          } else {
            const data = await res.json();
            setMessages(prev => [...prev, {
              role: "assistant",
              text: data.answer,
              citations: data.citations,
              found_in_notes: data.found_in_notes,
              confidence: data.confidence,
              retrieved_count: data.retrieved_count,
              timestamp: new Date().toISOString()
            }]);
            onRefreshMetrics();
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            role: "assistant",
            text: `Connection error: ${err.message}`,
            found_in_notes: false
          }]);
        } finally {
          setLoading(false);
        }
      };

      const handleClearHistory = async () => {
        if (!confirm("Clear full conversation history from database?")) return;
        try {
          const res = await fetch(`${API_BASE}/history`, { method: "DELETE" });
          if (res.ok) {
            setMessages([
              {
                role: "assistant",
                text: "Chat history cleared. What would you like to study next?"
              }
            ]);
            onRefreshMetrics();
          }
        } catch (e) {
          alert("Clear failed: " + e.message);
        }
      };

      const handleCopy = (text, idx) => {
        navigator.clipboard.writeText(text);
        setCopiedIdx(idx);
        setTimeout(() => setCopiedIdx(null), 2000);
      };

      return (
        <div class="max-w-4xl mx-auto flex flex-col h-[calc(100vh-6rem)] space-y-4">
          {/* Header & Context Bar */}
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-800">
            <div>
              <h2 class="text-2xl font-bold text-white tracking-tight">Chat With Your Study Notes</h2>
              <p class="text-xs text-slate-400 mt-0.5">Retrieval-Augmented Generation (RAG) with anti-hallucination guardrail (0.35 min threshold).</p>
            </div>
            <div class="flex items-center space-x-2 text-xs font-mono">
              <span class="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">
                FAISS FlatIP • 384-d
              </span>
              <button
                onClick={handleClearHistory}
                class="px-2.5 py-1 rounded-lg bg-red-950/40 hover:bg-red-900/60 border border-red-900/50 text-red-300 transition text-xs font-mono"
              >
                Clear History
              </button>
            </div>
          </div>

          {/* Starter Chips Bar */}
          <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs font-mono text-slate-400 select-none">
            <span class="text-slate-500 shrink-0">Sample Questions:</span>
            {starterQuestions.map((q, idx) => (
              <button
                key={idx}
                onClick={() => handleSend(q)}
                disabled={loading}
                class="shrink-0 px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/50 text-slate-300 hover:text-white transition text-[11px]"
              >
                {q}
              </button>
            ))}
          </div>

          {/* Message Stream */}
          <div class="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-5 overflow-y-auto space-y-5 shadow-inner">
            {loadingHistory ? (
              <div class="p-8 text-center text-xs font-mono text-indigo-400">
                Loading persistent study conversations from SQLite...
              </div>
            ) : (
              messages.map((m, idx) => (
                <div key={idx} class={`flex flex-col ${m.role === "user" ? "items-end" : "items-start"}`}>
                  <div class={`max-w-2xl p-4 rounded-xl text-sm ${
                    m.role === "user"
                      ? "bg-gradient-to-r from-indigo-600 to-indigo-700 text-white rounded-br-none shadow-md shadow-indigo-950"
                      : "bg-slate-950 text-slate-200 border border-slate-800 rounded-bl-none shadow-md shadow-slate-950"
                  }`}>
                    {/* Role Header */}
                    <div class="flex items-center justify-between text-[11px] font-mono mb-2 pb-1.5 border-b border-white/10 text-slate-400">
                      <span class="font-bold uppercase tracking-wider text-slate-300">
                        {m.role === "user" ? "You (Student)" : "AI Study Tutor"}
                      </span>
                      {m.timestamp && (
                        <span>{new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                      )}
                    </div>

                    <div class="leading-relaxed font-sans text-sm">
                      <FormattedTutorResponse text={m.text} />
                    </div>

                    {/* Citations Box */}
                    {m.citations && m.citations.length > 0 && (
                      <div class="mt-3.5 pt-3 border-t border-slate-800 text-xs font-mono space-y-2">
                        <div class="text-indigo-400 font-bold uppercase tracking-wider text-[11px] flex items-center justify-between">
                          <span>Grounding Citations & Verified References:</span>
                          <span class="text-slate-500 text-[10px]">{m.citations.length} Sources</span>
                        </div>
                        {m.citations.map((c, cIdx) => (
                          <div key={cIdx} class="p-3 bg-slate-900/90 rounded-lg border border-slate-800 text-slate-300 space-y-1">
                            <div class="flex items-center justify-between">
                              <span class="font-bold text-indigo-300">{c.document_name}</span>
                              <span class="text-emerald-400 font-mono text-[10px] bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800/60">
                                Relevance: {(c.relevance_score * 100).toFixed(1)}%
                              </span>
                            </div>
                            <div class="text-slate-400 text-[11px]">Page: {c.page_number}</div>
                            <div class="text-slate-300 text-[11px] italic mt-1 bg-slate-950 p-2 rounded border border-slate-800/80 font-sans">
                              "{c.snippet}"
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Grounding & Confidence Badges */}
                    {m.found_in_notes !== undefined && (
                      <div class="mt-3 pt-2 border-t border-slate-800/80 text-[11px] font-mono flex items-center justify-between flex-wrap gap-2">
                        <div class="flex items-center space-x-2">
                          <span class={`px-2 py-0.5 rounded font-bold ${
                            m.found_in_notes
                              ? "bg-emerald-950 text-emerald-300 border border-emerald-800"
                              : "bg-amber-950 text-amber-300 border border-amber-800"
                          }`}>
                            {m.found_in_notes ? "[Grounded in Notes]" : "[Out of Notes Scope]"}
                          </span>
                          <span class="text-slate-400">
                            Confidence: {m.confidence !== undefined ? `${(m.confidence * 100).toFixed(1)}%` : "N/A"}
                          </span>
                        </div>

                        {m.role === "assistant" && (
                          <button
                            onClick={() => handleCopy(m.text, idx)}
                            class="text-[10px] font-mono text-slate-400 hover:text-white px-2 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 transition"
                          >
                            {copiedIdx === idx ? "Copied!" : "Copy Answer"}
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              ))
            )}

            {loading && (
              <div class="p-3 bg-slate-950 rounded-xl border border-indigo-500/30 text-xs font-mono text-indigo-400 flex items-center space-x-2 animate-pulse">
                <span>[Retrieving relevant chunks from FAISS vector store & synthesizing grounded answer...]</span>
              </div>
            )}
          </div>

          {/* Input Form with Char Counter */}
          <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} class="space-y-1">
            <div class="flex gap-2">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                placeholder="Ask any conceptual or technical question grounded in your notes..."
                maxLength="1000"
                class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-indigo-500 font-sans shadow-inner"
              />
              <button
                type="submit"
                disabled={loading || !input.trim()}
                class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 px-6 py-3 rounded-xl text-xs font-mono uppercase font-bold tracking-wider transition"
              >
                {loading ? "Searching..." : "Ask Notes"}
              </button>
            </div>
            <div class="flex justify-between items-center text-[10px] font-mono text-slate-500 px-1">
              <span>Press Enter to send</span>
              <span>{input.length} / 1000 characters</span>
            </div>
          </form>
        </div>
      );
    }

    // ==========================================
    // 3. QUESTION CLASSIFIER VIEW (PyTorch MLP)
    // ==========================================
    function ClassifierView() {
      const [question, setQuestion] = useState("");
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const handleClassify = async (e) => {
        e.preventDefault();
        if (!question.trim() || loading) return;

        setLoading(true);
        setError(null);
        setResult(null);

        try {
          const res = await fetch(`${API_BASE}/classify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question })
          });

          if (!res.ok) {
            const data = await res.json();
            setError(formatErrorDetail(data, "Classification failed"));
          } else {
            const data = await res.json();
            setResult(data);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="max-w-3xl mx-auto space-y-6">
          <div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Question Subject Classifier</h2>
            <p class="text-xs text-slate-400 mt-1">Classify student queries into Python, AI, or ML using our trained PyTorch MLP neural network.</p>
          </div>

          {/* Preset Test Questions */}
          <div class="flex flex-wrap items-center gap-2 text-xs font-mono">
            <span class="text-slate-500">Quick Test Samples:</span>
            <button
              type="button"
              onClick={() => { setQuestion("What is the Global Interpreter Lock in Python and how does it manage thread execution?"); }}
              class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-indigo-300 border border-slate-800 hover:border-indigo-500 transition text-[11px]"
            >
              Python (GIL)
            </button>
            <button
              type="button"
              onClick={() => { setQuestion("How does backpropagation compute gradient descent to minimize loss in neural networks?"); }}
              class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-emerald-300 border border-slate-800 hover:border-emerald-500 transition text-[11px]"
            >
              ML (Backpropagation)
            </button>
            <button
              type="button"
              onClick={() => { setQuestion("How does the A* search algorithm evaluate paths using admissible heuristics?"); }}
              class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-amber-300 border border-slate-800 hover:border-amber-500 transition text-[11px]"
            >
              AI (A* Heuristics)
            </button>
          </div>

          <form onSubmit={handleClassify} class="space-y-4">
            <div>
              <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Student Question:</label>
              <textarea
                value={question}
                onChange={(e) => setQuestion(e.target.value)}
                placeholder="e.g. How does backpropagation update weights in a neural network?"
                rows="3"
                class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 font-sans"
              />
            </div>
            <button
              type="submit"
              disabled={loading || !question.trim()}
              class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 px-6 py-2.5 rounded-lg text-xs font-mono uppercase font-bold tracking-wider transition"
            >
              {loading ? "Classifying..." : "Classify Question"}
            </button>
          </form>

          {error && (
            <div class="p-4 bg-red-950/50 border border-red-800 rounded-lg text-sm text-red-300">
              {error}
            </div>
          )}

          {result && (
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
              <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div>
                  <div class="text-xs font-mono text-slate-400">Predicted Subject</div>
                  <div class="text-2xl font-bold text-indigo-400 mt-1">{result.category}</div>
                </div>
                <div class="text-right">
                  <div class="text-xs font-mono text-slate-400">Confidence Score</div>
                  <div class="text-2xl font-bold text-emerald-400 mt-1">{(result.confidence * 100).toFixed(1)}%</div>
                </div>
              </div>

              <div>
                <div class="text-xs font-mono uppercase text-slate-400 mb-2">Class Probability Distribution:</div>
                <div class="space-y-2">
                  {Object.entries(result.probabilities).map(([cat, prob]) => (
                    <div key={cat} class="space-y-1">
                      <div class="flex justify-between text-xs font-mono text-slate-300">
                        <span>{cat}</span>
                        <span>{(prob * 100).toFixed(1)}%</span>
                      </div>
                      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div class="bg-indigo-500 h-full rounded-full transition-all" style={{ width: `${prob * 100}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 4. UPGRADED DOCUMENTS & VECTOR STORE VIEW
    // ==========================================
    function DocumentsView({ onUploaded }) {
      const [documents, setDocuments] = useState([]);
      const [uploading, setUploading] = useState(false);
      const [uploadStage, setUploadStage] = useState("");
      const [statusMsg, setStatusMsg] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [inspectDoc, setInspectDoc] = useState(null);
      const [docChunks, setDocChunks] = useState([]);
      const [loadingChunks, setLoadingChunks] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");

      const loadDocuments = async () => {
        try {
          const res = await fetch(`${API_BASE}/documents`);
          if (res.ok) {
            const data = await res.json();
            setDocuments(data);
          }
        } catch (e) {
          console.error("Failed to load documents", e);
        }
      };

      useEffect(() => {
        loadDocuments();
      }, []);

      const processFile = async (file) => {
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext !== 'pdf' && ext !== 'txt') {
          setStatusMsg({ type: 'error', text: `Unsupported format .${ext}. Only .pdf and .txt files are supported.` });
          return;
        }

        if (file.size > 15 * 1024 * 1024) {
          setStatusMsg({ type: 'error', text: "File size exceeds 15MB limit." });
          return;
        }

        setUploading(true);
        setStatusMsg(null);
        setUploadStage("1/4: Ingesting file stream...");

        setTimeout(() => setUploadStage("2/4: Extracting text & sliding-window chunking (400 chars, 60 overlap)..."), 700);
        setTimeout(() => setUploadStage("3/4: Generating 384-d dense embeddings (all-MiniLM-L6-v2)..."), 1800);
        setTimeout(() => setUploadStage("4/4: Indexing vectors into FAISS & SQLite..."), 2900);

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch(`${API_BASE}/upload`, {
            method: "POST",
            body: formData
          });

          if (!res.ok) {
            const err = await res.json();
            setStatusMsg({ type: 'error', text: `Upload failed: ${formatErrorDetail(err, "Server error")}` });
          } else {
            const data = await res.json();
            setStatusMsg({
              type: 'success',
              text: `Indexed '${data.document_name}': ${data.chunks_created} chunks added. Total FAISS vectors: ${data.total_indexed_chunks}`
            });
            loadDocuments();
            onUploaded();
          }
        } catch (err) {
          setStatusMsg({ type: 'error', text: `Network error: ${err.message}` });
        } finally {
          setUploading(false);
          setUploadStage("");
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          processFile(e.dataTransfer.files[0]);
        }
      };

      const handleInspect = async (filename) => {
        setInspectDoc(filename);
        setLoadingChunks(true);
        setDocChunks([]);

        try {
          const res = await fetch(`${API_BASE}/documents/${encodeURIComponent(filename)}/chunks`);
          if (res.ok) {
            const chunks = await res.json();
            setDocChunks(chunks);
          } else {
            alert("Could not load chunks for " + filename);
          }
        } catch (e) {
          alert("Error fetching chunks: " + e.message);
        } finally {
          setLoadingChunks(false);
        }
      };

      const handleDelete = async (filename) => {
        if (!confirm(`Are you sure you want to delete '${filename}'? This will remove its chunks from FAISS vector store and SQLite.`)) return;
        try {
          const res = await fetch(`${API_BASE}/documents/${encodeURIComponent(filename)}`, {
            method: "DELETE"
          });
          if (res.ok) {
            setStatusMsg({ type: 'info', text: `Document '${filename}' deleted from database and vector index.` });
            if (inspectDoc === filename) {
              setInspectDoc(null);
              setDocChunks([]);
            }
            loadDocuments();
            onUploaded();
          } else {
            const err = await res.json();
            alert(`Delete failed: ${formatErrorDetail(err, "Delete failed")}`);
          }
        } catch (e) {
          alert("Delete failed: " + e.message);
        }
      };

      const handleLoadSample = async () => {
        setUploading(true);
        setUploadStage("Re-indexing bundled sample study notes...");
        try {
          const res = await fetch(`${API_BASE}/documents/sample`, { method: "POST" });
          if (res.ok) {
            const data = await res.json();
            setStatusMsg({
              type: 'success',
              text: `Sample notes successfully indexed into FAISS (${data.chunks_created} chunks).`
            });
            loadDocuments();
            onUploaded();
          } else {
            const err = await res.json();
            alert("Failed to load sample: " + formatErrorDetail(err, "Load failed"));
          }
        } catch (e) {
          alert("Sample load error: " + e.message);
        } finally {
          setUploading(false);
          setUploadStage("");
        }
      };

      const filteredDocs = documents.filter(d =>
        d.filename.toLowerCase().includes(searchTerm.toLowerCase()) ||
        d.file_type.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const totalChunksAcrossAll = documents.reduce((acc, d) => acc + (d.chunks_count || 0), 0);

      return (
        <div class="max-w-5xl mx-auto space-y-6">
          {/* Header & Stats Bar */}
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-800">
            <div>
              <h2 class="text-2xl font-bold text-white tracking-tight">Study Documents & Vector Knowledge Base</h2>
              <p class="text-xs text-slate-400 mt-1">Upload, chunk, embed, and inspect technical lecture notes in FAISS vector store.</p>
            </div>
            <div class="flex items-center space-x-2 text-xs font-mono">
              <span class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">
                Docs: <strong class="text-white">{documents.length}</strong>
              </span>
              <span class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">
                Total Chunks: <strong class="text-indigo-400">{totalChunksAcrossAll}</strong>
              </span>
              <button
                onClick={handleLoadSample}
                disabled={uploading}
                class="px-3 py-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/60 text-indigo-300 hover:text-white transition font-mono font-medium text-xs disabled:opacity-50"
              >
                Reload Sample Notes
              </button>
            </div>
          </div>

          {/* Drag & Drop Upload Zone */}
          <div
            onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
            onDragLeave={() => setIsDragging(false)}
            onDrop={handleDrop}
            class={`border-2 border-dashed rounded-2xl p-8 text-center transition select-none ${
              isDragging
                ? "border-indigo-500 bg-indigo-950/20 shadow-lg shadow-indigo-500/10"
                : "border-slate-800 hover:border-slate-700 bg-slate-900/60"
            }`}
          >
            <input
              type="file"
              id="filePicker"
              accept=".pdf,.txt"
              onChange={(e) => {
                if (e.target.files && e.target.files.length > 0) {
                  processFile(e.target.files[0]);
                }
              }}
              class="hidden"
              disabled={uploading}
            />

            <label for="filePicker" class="cursor-pointer block space-y-3">
              <div class="inline-flex p-3 rounded-xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
              </div>
              <div>
                <span class="text-sm font-bold text-white tracking-wide block">
                  {uploading ? "Processing Document..." : "Drag and drop PDF or TXT lecture notes here"}
                </span>
                <span class="text-xs text-slate-400 mt-1 block">
                  or <span class="text-indigo-400 underline font-semibold">browse computer files</span> (Max 15MB)
                </span>
              </div>
              <div class="flex items-center justify-center space-x-3 text-[11px] font-mono text-slate-500">
                <span>PDF (PyPDF extracted)</span>
                <span>•</span>
                <span>TXT (UTF-8)</span>
                <span>•</span>
                <span>Sentence Boundary Chunking</span>
              </div>
            </label>

            {/* Real-Time Upload Progress Tracker */}
            {uploading && (
              <div class="mt-4 max-w-md mx-auto p-3.5 bg-slate-950 rounded-xl border border-indigo-500/40 space-y-2">
                <div class="flex items-center justify-between text-xs font-mono text-indigo-400">
                  <span class="font-bold">Vector Ingestion Pipeline</span>
                  <span class="animate-pulse">Running</span>
                </div>
                <div class="text-xs font-mono text-slate-300 text-left bg-slate-900 p-2 rounded border border-slate-800">
                  {uploadStage}
                </div>
                <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-indigo-500 h-full rounded-full animate-pulse" style={{ width: '80%' }}></div>
                </div>
              </div>
            )}
          </div>

          {/* Feedback Banners */}
          {statusMsg && (
            <div class={`p-4 rounded-xl text-xs font-mono flex items-center justify-between ${
              statusMsg.type === 'success'
                ? "bg-emerald-950/60 border border-emerald-800 text-emerald-300"
                : statusMsg.type === 'error'
                ? "bg-red-950/60 border border-red-800 text-red-300"
                : "bg-indigo-950/60 border border-indigo-800 text-indigo-300"
            }`}>
              <span>{statusMsg.text}</span>
              <button onClick={() => setStatusMsg(null)} class="text-slate-400 hover:text-white font-bold ml-4">✕</button>
            </div>
          )}

          {/* Document Inventory Table */}
          <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg shadow-slate-950">
            <div class="p-4 border-b border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900/80">
              <div class="flex items-center space-x-2">
                <span class="text-xs font-mono uppercase tracking-wider text-slate-400">Registered Documents</span>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">
                  {documents.length} Files in Knowledge Base
                </span>
              </div>
              <div>
                <input
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder="Filter documents by name or format..."
                  class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-indigo-500 font-sans w-64"
                />
              </div>
            </div>

            {filteredDocs.length === 0 ? (
              <div class="p-10 text-center space-y-2">
                <div class="text-xs font-mono text-slate-500">
                  {documents.length === 0
                    ? "No study notes indexed yet. Drag and drop a file above or click 'Reload Sample Notes'."
                    : "No documents matching search filter."}
                </div>
              </div>
            ) : (
              <div class="divide-y divide-slate-800/80">
                {filteredDocs.map(doc => {
                  const isPdf = doc.file_type.toLowerCase() === "pdf";
                  const isBeingInspected = inspectDoc === doc.filename;

                  return (
                    <div key={doc.id} class="p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 hover:bg-slate-800/30 transition">
                      <div class="flex items-start space-x-3.5">
                        <div class={`p-2.5 rounded-lg border text-xs font-mono font-bold uppercase mt-0.5 ${
                          isPdf
                            ? "bg-rose-950/60 border-rose-800/70 text-rose-300"
                            : "bg-sky-950/60 border-sky-800/70 text-sky-300"
                        }`}>
                          {doc.file_type}
                        </div>
                        <div>
                          <div class="text-sm font-bold text-white tracking-wide">{doc.filename}</div>
                          <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs font-mono text-slate-400 mt-1">
                            <span>Chunks: <strong class="text-indigo-400">{doc.chunks_count}</strong></span>
                            <span>•</span>
                            <span>Size: {(doc.file_size_bytes / 1024).toFixed(1)} KB</span>
                            <span>•</span>
                            <span>Indexed: {doc.uploaded_at ? new Date(doc.uploaded_at).toLocaleDateString() : "Active"}</span>
                            <span>•</span>
                            <span class="text-emerald-400 font-semibold">[FAISS FlatIP]</span>
                          </div>
                        </div>
                      </div>

                      <div class="flex items-center space-x-2 self-end md:self-auto">
                        <button
                          onClick={() => handleInspect(doc.filename)}
                          class={`text-xs font-mono px-3 py-1.5 rounded-lg border transition flex items-center space-x-1.5 ${
                            isBeingInspected
                              ? "bg-indigo-600 text-white border-indigo-500"
                              : "bg-slate-950 hover:bg-slate-800 border-slate-700 text-slate-300 hover:text-white"
                          }`}
                        >
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                          <span>{isBeingInspected ? "Inspecting" : "Inspect Chunks"}</span>
                        </button>

                        <button
                          onClick={() => handleDelete(doc.filename)}
                          class="text-xs font-mono text-red-400 hover:text-red-200 px-3 py-1.5 rounded-lg bg-red-950/40 hover:bg-red-900/60 border border-red-900/50 transition flex items-center space-x-1"
                        >
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                          <span>Delete</span>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Interactive Chunk Inspector Panel */}
          {inspectDoc && (
            <div class="bg-slate-900 border border-indigo-500/40 rounded-xl p-6 space-y-4 shadow-xl shadow-slate-950">
              <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div>
                  <div class="text-xs font-mono text-indigo-400 uppercase tracking-wider">Chunk Inspector</div>
                  <h3 class="text-lg font-bold text-white mt-0.5">{inspectDoc}</h3>
                </div>
                <div class="flex items-center space-x-3">
                  <span class="text-xs font-mono text-slate-400">
                    {docChunks.length} Chunks Loaded
                  </span>
                  <button
                    onClick={() => setInspectDoc(null)}
                    class="text-xs font-mono px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300"
                  >
                    Close
                  </button>
                </div>
              </div>

              {loadingChunks ? (
                <div class="p-8 text-center text-xs font-mono text-indigo-400">
                  Retrieving chunk embeddings from FAISS metadata...
                </div>
              ) : docChunks.length === 0 ? (
                <div class="p-6 text-center text-xs font-mono text-slate-500">
                  No chunk records found for this document in active index.
                </div>
              ) : (
                <div class="space-y-3 max-h-96 overflow-y-auto pr-2">
                  {docChunks.map((chunk, cIdx) => (
                    <div key={cIdx} class="p-4 bg-slate-950 rounded-lg border border-slate-800 space-y-2">
                      <div class="flex items-center justify-between text-xs font-mono">
                        <span class="text-indigo-400 font-bold">Chunk #{chunk.chunk_id + 1}</span>
                        <div class="flex items-center space-x-2 text-slate-400">
                          <span>Page {chunk.page_number}</span>
                          <span>•</span>
                          <span>{chunk.char_length} Characters</span>
                        </div>
                      </div>
                      <p class="text-xs text-slate-300 leading-relaxed font-sans bg-slate-900/60 p-3 rounded border border-slate-800/80">
                        {chunk.text}
                      </p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. SUMMARIZER TOOL VIEW
    // ==========================================
    function SummarizerView() {
      const [maxPoints, setMaxPoints] = useState(5);
      const [selectedDoc, setSelectedDoc] = useState("");
      const [docList, setDocList] = useState([]);
      const [summary, setSummary] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch(`${API_BASE}/documents`)
          .then(r => r.json())
          .then(data => {
            if (Array.isArray(data)) setDocList(data);
          })
          .catch(() => {});
      }, []);

      const handleSummarize = async () => {
        setLoading(true);
        setError(null);
        setSummary(null);

        try {
          const payload = { max_points: maxPoints };
          if (selectedDoc) payload.document_name = selectedDoc;

          const res = await fetch(`${API_BASE}/summarize`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const data = await res.json();
            setError(formatErrorDetail(data, "Summarization failed"));
          } else {
            const data = await res.json();
            setSummary(data);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="max-w-3xl mx-auto space-y-6">
          <div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Notes Summarizer Tool</h2>
            <p class="text-xs text-slate-400 mt-1">Distill lengthy study material into structured executive overviews and core takeaways.</p>
          </div>

          <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Document to Summarize:</label>
                <select
                  value={selectedDoc}
                  onChange={(e) => setSelectedDoc(e.target.value)}
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 font-sans"
                >
                  <option value="">All Uploaded Notes</option>
                  {docList.map(d => (
                    <option key={d.filename} value={d.filename}>{d.filename} ({d.chunks_count} chunks)</option>
                  ))}
                </select>
              </div>
              <div>
                <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Max Takeaway Points: {maxPoints}</label>
                <input
                  type="range"
                  min="3"
                  max="10"
                  value={maxPoints}
                  onChange={(e) => setMaxPoints(parseInt(e.target.value))}
                  class="w-full accent-indigo-500 cursor-pointer mt-2"
                />
              </div>
            </div>
            <button
              onClick={handleSummarize}
              disabled={loading}
              class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 px-6 py-2.5 rounded-lg text-xs font-mono uppercase font-bold tracking-wider transition"
            >
              {loading ? "Analyzing Notes..." : "Generate Summary"}
            </button>
          </div>

          {error && (
            <div class="p-4 bg-red-950/50 border border-red-800 rounded-lg text-sm text-red-300">
              {error}
            </div>
          )}

          {summary && (
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-5">
              <div>
                <div class="text-xs font-mono text-indigo-400 uppercase">Document Analyzed</div>
                <div class="text-lg font-bold text-white mt-1">{summary.document_name}</div>
              </div>

              <div>
                <div class="text-xs font-mono uppercase text-slate-400 mb-2">Executive Summary:</div>
                <p class="text-sm text-slate-300 leading-relaxed bg-slate-950 p-4 rounded-lg border border-slate-800">
                  {summary.executive_summary}
                </p>
              </div>

              <div>
                <div class="text-xs font-mono uppercase text-slate-400 mb-2">Key Core Takeaways:</div>
                <ul class="space-y-2">
                  {summary.key_takeaways.map((pt, idx) => (
                    <li key={idx} class="text-sm text-slate-200 flex items-start space-x-2">
                      <span class="text-indigo-400 font-mono text-xs mt-0.5">•</span>
                      <span>{pt}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. PRACTICE QUIZ GENERATOR VIEW
    // ==========================================
    function QuizView({ onRefreshMetrics }) {
      const [topic, setTopic] = useState("Python");
      const [numQuestions, setNumQuestions] = useState(3);
      const [quizData, setQuizData] = useState(null);
      const [userAnswers, setUserAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const [loading, setLoading] = useState(false);

      const handleGenerate = async () => {
        setLoading(true);
        setQuizData(null);
        setUserAnswers({});
        setSubmitted(false);

        try {
          const res = await fetch(`${API_BASE}/quiz`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic, num_questions: numQuestions })
          });

          if (res.ok) {
            const data = await res.json();
            setQuizData(data);
          }
        } catch (e) {
          alert("Quiz generation failed: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      const handleOptionSelect = (qId, opt) => {
        if (submitted) return;
        const optLetter = opt.charAt(0);
        setUserAnswers(prev => ({ ...prev, [qId]: optLetter }));
      };

      const handleSubmitQuiz = async () => {
        if (!quizData || !quizData.questions) return;
        let calculatedScore = 0;
        quizData.questions.forEach(q => {
          if (userAnswers[q.id] === q.correct_option) {
            calculatedScore += 1;
          }
        });

        setScore(calculatedScore);
        setSubmitted(true);

        try {
          await fetch(`${API_BASE}/quiz/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              topic: quizData.topic || topic,
              score: calculatedScore,
              total_questions: quizData.questions.length
            })
          });
          onRefreshMetrics();
        } catch (e) {
          console.error("Error persisting quiz result", e);
        }
      };

      return (
        <div class="max-w-3xl mx-auto space-y-6">
          <div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Interactive MCQ Quiz Generator</h2>
            <p class="text-xs text-slate-400 mt-1">Generate multiple-choice practice tests grounded in your study notes with explanations.</p>
          </div>

          <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Subject / Topic:</label>
                <select
                  value={topic}
                  onChange={(e) => setTopic(e.target.value)}
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 font-sans"
                >
                  <option value="Python">Python Internals</option>
                  <option value="Machine Learning">Machine Learning & Regularization</option>
                  <option value="Artificial Intelligence">Artificial Intelligence & Search</option>
                  <option value="MongoDB">MongoDB NoSQL & Aggregations</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Number of Questions: {numQuestions}</label>
                <input
                  type="range"
                  min="1"
                  max="5"
                  value={numQuestions}
                  onChange={(e) => setNumQuestions(parseInt(e.target.value))}
                  class="w-full accent-indigo-500 cursor-pointer mt-2"
                />
              </div>
            </div>
            <button
              onClick={handleGenerate}
              disabled={loading}
              class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 px-6 py-2.5 rounded-lg text-xs font-mono uppercase font-bold tracking-wider transition"
            >
              {loading ? "Generating Quiz..." : "Generate Practice Quiz"}
            </button>
          </div>

          {quizData && quizData.questions && (
            <div class="space-y-6">
              {quizData.questions.map((q, qIndex) => (
                <div key={q.id} class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-3">
                  <div class="text-sm font-semibold text-white">
                    <span class="text-indigo-400 font-mono mr-2">Q{qIndex + 1}.</span>
                    {q.question}
                  </div>

                  <div class="space-y-2 pt-2">
                    {q.options.map((opt, oIndex) => {
                      const letter = opt.charAt(0);
                      const isSelected = userAnswers[q.id] === letter;
                      const isCorrect = q.correct_option === letter;

                      let btnStyle = "bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-800";
                      if (submitted) {
                        if (isCorrect) {
                          btnStyle = "bg-emerald-950 border-emerald-600 text-emerald-200";
                        } else if (isSelected && !isCorrect) {
                          btnStyle = "bg-red-950 border-red-600 text-red-200";
                        }
                      } else if (isSelected) {
                        btnStyle = "bg-indigo-600/30 border-indigo-500 text-indigo-300";
                      }

                      return (
                        <button
                          key={oIndex}
                          onClick={() => handleOptionSelect(q.id, opt)}
                          class={`w-full text-left p-3 rounded-lg text-xs font-sans border transition ${btnStyle}`}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>

                  {submitted && (
                    <div class="mt-3 p-3 bg-slate-950 rounded border border-slate-800 text-xs font-mono">
                      <div class="text-emerald-400 font-bold">Correct Option: {q.correct_option}</div>
                      <div class="text-slate-400 mt-1">{q.explanation}</div>
                    </div>
                  )}
                </div>
              ))}

              {!submitted ? (
                <button
                  onClick={handleSubmitQuiz}
                  class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-xs uppercase tracking-wider font-mono transition"
                >
                  Submit Quiz Answers
                </button>
              ) : (
                <div class="bg-slate-900 border border-emerald-500/50 p-6 rounded-xl text-center space-y-2">
                  <div class="text-xs uppercase font-mono text-emerald-400">Final Quiz Scorecard</div>
                  <div class="text-3xl font-bold text-white font-mono">{score} / {quizData.questions.length}</div>
                  <p class="text-xs text-slate-400">Score percentage: {((score / quizData.questions.length) * 100).toFixed(0)}% recorded to SQLite database.</p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. AUTONOMOUS AI AGENT VIEW
    // ==========================================
    function AgentView({ onRefreshMetrics }) {
      const [prompt, setPrompt] = useState("");
      const [agentResult, setAgentResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const handleRunAgent = async (e) => {
        e.preventDefault();
        if (!prompt.trim() || loading) return;

        setLoading(true);
        setError(null);
        setAgentResult(null);

        try {
          const res = await fetch(`${API_BASE}/agent`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });

          if (!res.ok) {
            const data = await res.json();
            setError(formatErrorDetail(data, "Agent workflow execution failed"));
          } else {
            const data = await res.json();
            setAgentResult(data);
            onRefreshMetrics();
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="max-w-4xl mx-auto space-y-6">
          <div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Autonomous AI Agent</h2>
            <p class="text-xs text-slate-400 mt-1">Natural language prompt routing. The agent automatically detects intent and executes Answer, Summary, or Quiz tool.</p>
          </div>

          <form onSubmit={handleRunAgent} class="space-y-3">
            <div class="flex gap-2">
              <input
                type="text"
                value={prompt}
                onChange={(e) => setPrompt(e.target.value)}
                placeholder="e.g. 'Summarize my notes', 'Create 3 MCQs on Python', or 'Explain the GIL'"
                class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 font-sans"
              />
              <button
                type="submit"
                disabled={loading || !prompt.trim()}
                class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 px-6 py-3 rounded-lg text-xs font-mono uppercase tracking-wider font-bold transition"
              >
                {loading ? "Agent Running..." : "Execute"}
              </button>
            </div>
            <div class="flex flex-wrap items-center gap-2 text-xs font-mono text-slate-400">
              <span class="text-slate-500">Suggested Prompts:</span>
              <button
                type="button"
                onClick={() => setPrompt("Explain Python memory management and the GIL")}
                class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-indigo-900/40 text-indigo-300 hover:text-white transition text-[11px]"
              >
                [Q&A] "Explain GIL"
              </button>
              <button
                type="button"
                onClick={() => setPrompt("Summarize MongoDB Handbook.pdf")}
                class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-sky-900/40 text-sky-300 hover:text-white transition text-[11px]"
              >
                [Summary] "Summarize MongoDB"
              </button>
              <button
                type="button"
                onClick={() => setPrompt("Create a 3 question practice quiz on MongoDB")}
                class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-amber-900/40 text-amber-300 hover:text-white transition text-[11px]"
              >
                [Quiz] "MongoDB Quiz"
              </button>
              <button
                type="button"
                onClick={() => setPrompt("Create 3 MCQs on Machine Learning")}
                class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-emerald-900/40 text-emerald-300 hover:text-white transition text-[11px]"
              >
                [Quiz] "ML MCQs"
              </button>
            </div>
          </form>

          {error && (
            <div class="p-4 bg-red-950/50 border border-red-800 rounded-lg text-sm text-red-300">
              {error}
            </div>
          )}

          {agentResult && (
            <div class="space-y-6">
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-b border-slate-800 pb-4">
                  <div>
                    <div class="text-xs font-mono text-slate-400">Detected Intent</div>
                    <div class="text-xl font-bold text-indigo-400 mt-1 font-mono">{agentResult.intent}</div>
                  </div>
                  <div>
                    <div class="text-xs font-mono text-slate-400">Confidence Score</div>
                    <div class="text-xl font-bold text-emerald-400 mt-1 font-mono">{(agentResult.confidence * 100).toFixed(0)}%</div>
                  </div>
                  <div>
                    <div class="text-xs font-mono text-slate-400">Routed Tool</div>
                    <div class="text-xl font-bold text-amber-400 mt-1 font-mono">{agentResult.tool_used}</div>
                  </div>
                </div>

                <div class="mt-4">
                  <div class="text-xs font-mono uppercase text-slate-400 mb-2 flex items-center justify-between">
                    <span>Autonomous State Machine Trace:</span>
                    <span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800">
                      {agentResult.execution_trace.length} States Resolved
                    </span>
                  </div>
                  <div class="bg-slate-950 rounded-xl p-4 border border-slate-800 space-y-2 font-mono text-xs shadow-inner">
                    {agentResult.execution_trace.map((step, idx) => {
                      let tagColor = "bg-slate-800 text-slate-300 border-slate-700";
                      let tagText = "STEP";
                      if (step.includes("[START]")) {
                        tagColor = "bg-blue-950 text-blue-300 border-blue-800";
                        tagText = "START";
                      } else if (step.includes("[INTENT_DETECTION]")) {
                        tagColor = "bg-indigo-950 text-indigo-300 border-indigo-800";
                        tagText = "INTENT";
                      } else if (step.includes("[TOOL_ROUTED]")) {
                        tagColor = "bg-amber-950 text-amber-300 border-amber-800";
                        tagText = "ROUTER";
                      } else if (step.includes("[EXECUTION_SUCCESS]")) {
                        tagColor = "bg-emerald-950 text-emerald-300 border-emerald-800";
                        tagText = "EXEC";
                      } else if (step.includes("[RESPONSE_SYNTHESIS]")) {
                        tagColor = "bg-purple-950 text-purple-300 border-purple-800";
                        tagText = "SYNTH";
                      }
                      return (
                        <div key={idx} class="flex items-start space-x-2.5 p-2 rounded-lg bg-slate-900/60 border border-slate-800/80">
                          <span class={`px-1.5 py-0.5 text-[9px] font-bold rounded border uppercase shrink-0 ${tagColor}`}>
                            {tagText}
                          </span>
                          <span class="text-slate-300 leading-relaxed font-mono text-[11px] flex-1">
                            {step.replace(/^\[[A-Z_]+\]\s*/, "")}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-2">
                <div class="text-xs font-mono uppercase text-slate-400">Synthesized Agent Response:</div>
                <div class="bg-slate-950 p-5 rounded-lg border border-slate-800 text-sm text-slate-200 font-sans shadow-inner">
                  <FormattedTutorResponse text={agentResult.agent_response} />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. SYSTEM DIAGNOSTICS & SETTINGS VIEW
    // ==========================================
    function SettingsView({ status }) {
      return (
        <div class="max-w-3xl mx-auto space-y-6">
          <div>
            <h2 class="text-2xl font-bold text-white tracking-tight">System Diagnostics & Security Settings</h2>
            <p class="text-xs text-slate-400 mt-1">Runtime health, guardrail parameters, and active models.</p>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-xl divide-y divide-slate-800">
            <div class="p-4 flex justify-between items-center">
              <div>
                <div class="text-sm font-semibold text-white">Backend Server Status</div>
                <div class="text-xs text-slate-400">FastAPI ASGI Server at 127.0.0.1:8000</div>
              </div>
              <span class="text-xs font-mono px-2 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold">
                {status}
              </span>
            </div>

            <div class="p-4 flex justify-between items-center">
              <div>
                <div class="text-sm font-semibold text-white">Prompt Injection Guard</div>
                <div class="text-xs text-slate-400">Blocks adversarial system prompt overrides and DAN jailbreaks</div>
              </div>
              <span class="text-xs font-mono px-2 py-1 rounded bg-indigo-950 text-indigo-400 border border-indigo-800">
                ACTIVE
              </span>
            </div>

            <div class="p-4 flex justify-between items-center">
              <div>
                <div class="text-sm font-semibold text-white">PII & Secret Sanitizer</div>
                <div class="text-xs text-slate-400">Automatic masking for emails, phone numbers, and API tokens</div>
              </div>
              <span class="text-xs font-mono px-2 py-1 rounded bg-indigo-950 text-indigo-400 border border-indigo-800">
                ACTIVE
              </span>
            </div>

            <div class="p-4 flex justify-between items-center">
              <div>
                <div class="text-sm font-semibold text-white">Rate Limiter</div>
                <div class="text-xs text-slate-400">In-memory sliding window (120 requests/minute per client IP)</div>
              </div>
              <span class="text-xs font-mono px-2 py-1 rounded bg-indigo-950 text-indigo-400 border border-indigo-800">
                ACTIVE
              </span>
            </div>

            <div class="p-4 flex justify-between items-center">
              <div>
                <div class="text-sm font-semibold text-white">Anti-Hallucination Threshold</div>
                <div class="text-xs text-slate-400">Strictly rejects queries below 0.35 semantic relevance</div>
              </div>
              <span class="text-xs font-mono px-2 py-1 rounded bg-slate-800 text-slate-300">
                0.35 Min Score
              </span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
