<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Study Assistant - Student Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = "";

    // Robust Error Detail Formatter to prevent any [object Object] rendering
    function formatErrorDetail(err, fallback = "Request failed") {
      if (!err) return fallback;
      const detail = err.detail !== undefined ? err.detail : err;
      if (typeof detail === "string") return detail;
      if (Array.isArray(detail)) {
        return detail.map(d => d.msg || JSON.stringify(d)).join(", ");
      }
      if (typeof detail === "object") {
        return JSON.stringify(detail);
      }
      return String(detail) || fallback;
    }

    // Clean SVG Icons (Zero Emojis)
    const Icons = {
      Dashboard: () => (
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
      ),
      Chat: () => (
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
      ),
      Classifier: () => (
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
      ),
      Documents: () => (
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
      ),
      Summarizer: () => (
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h10M4 18h7" /></svg>
      ),
      Quiz: () => (
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
      ),
      Agent: () => (
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
      ),
      Settings: () => (
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
      ),
      Check: () => (
        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" /></svg>
      ),
      ArrowRight: () => (
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
      ),
      Sparkle: () => (
        <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>
      )
    };

    // Lightweight Markdown & Tutor Formatter
    function renderInlineMarkdown(str) {
      if (!str) return "";
      const tokens = str.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
      return tokens.map((tok, i) => {
        if (tok.startsWith("**") && tok.endsWith("**") && tok.length > 4) {
          return <strong key={i} class="font-bold text-white">{tok.slice(2, -2)}</strong>;
        }
        if (tok.startsWith("`") && tok.endsWith("`") && tok.length > 2) {
          return <code key={i} class="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 font-mono text-indigo-300 text-[11px]">{tok.slice(1, -1)}</code>;
        }
        return <span key={i}>{tok}</span>;
      });
    }

    function FormattedTutorResponse({ text }) {
      if (!text) return null;
      const lines = text.split("\n");
      const elements = [];
      let currentBullets = [];

      const flushBullets = (keyPrefix) => {
        if (currentBullets.length > 0) {
          elements.push(
            <div key={`${keyPrefix}-bullets`} class="my-2.5 space-y-1.5">
              {currentBullets.map((b, bIdx) => (
                <div key={bIdx} class="flex items-start space-x-2.5 p-2 rounded-lg bg-slate-900/60 border border-slate-800/80 text-xs text-slate-200">
                  <span class="text-indigo-400 font-mono mt-0.5 shrink-0">•</span>
                  <div class="flex-1 leading-relaxed">
                    {renderInlineMarkdown(b)}
                  </div>
                </div>
              ))}
            </div>
          );
          currentBullets = [];
        }
      };

      lines.forEach((line, idx) => {
        const trimmed = line.trim();
        if (!trimmed) {
          flushBullets(`f-${idx}`);
          return;
        }

        if (trimmed.startsWith("### Concept Overview") || trimmed.startsWith("### Overview")) {
          flushBullets(`h-${idx}`);
          elements.push(
            <div key={idx} class="mt-3 mb-1.5 flex items-center space-x-2">
              <span class="px-2 py-0.5 text-[10px] font-mono font-bold uppercase rounded bg-indigo-950 text-indigo-300 border border-indigo-800">
                Overview
              </span>
              <span class="font-bold text-slate-100 text-xs font-mono uppercase tracking-wider">Concept Definition</span>
            </div>
          );
        } else if (trimmed.startsWith("### Key Technical Breakdown") || trimmed.startsWith("### Key Mechanics")) {
          flushBullets(`h-${idx}`);
          elements.push(
            <div key={idx} class="mt-3.5 mb-1.5 flex items-center space-x-2">
              <span class="px-2 py-0.5 text-[10px] font-mono font-bold uppercase rounded bg-emerald-950 text-emerald-300 border border-emerald-800">
                Mechanisms
              </span>
              <span class="font-bold text-slate-100 text-xs font-mono uppercase tracking-wider">Technical Details</span>
            </div>
          );
        } else if (trimmed.startsWith("### Practical Takeaways") || trimmed.startsWith("### Practical Usage")) {
          flushBullets(`h-${idx}`);
          elements.push(
            <div key={idx} class="mt-3.5 mb-1.5 flex items-center space-x-2">
              <span class="px-2 py-0.5 text-[10px] font-mono font-bold uppercase rounded bg-amber-950 text-amber-300 border border-amber-800">
                Takeaways
              </span>
              <span class="font-bold text-slate-100 text-xs font-mono uppercase tracking-wider">Practical Usage & Guidance</span>
            </div>
          );
        } else if (trimmed.startsWith("•") || trimmed.startsWith("-")) {
          currentBullets.push(trimmed.replace(/^[•\-]\s*/, ""));
        } else if (trimmed.startsWith("---")) {
          flushBullets(`hr-${idx}`);
          elements.push(<hr key={idx} class="my-3 border-slate-800" />);
        } else {
          flushBullets(`p-${idx}`);
          elements.push(
            <p key={idx} class="text-xs text-slate-300 leading-relaxed my-1">
              {renderInlineMarkdown(trimmed)}
            </p>
          );
        }
      });

      flushBullets("final");
      return <div class="space-y-1">{elements}</div>;
    }

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [dashboardData, setDashboardData] = useState(null);
      const [systemStatus, setSystemStatus] = useState("Checking...");
      const [loading, setLoading] = useState(true);

      const fetchDashboardSummary = async () => {
        try {
          const res = await fetch(`${API_BASE}/dashboard/summary`);
          if (res.ok) {
            const data = await res.json();
            setDashboardData(data);
            setSystemStatus("Online");
          } else {
            setSystemStatus("Degraded");
          }
        } catch (e) {
          console.error("Dashboard summary fetch failed", e);
          setSystemStatus("Disconnected");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDashboardSummary();
        const timer = setInterval(fetchDashboardSummary, 12000);
        return () => clearInterval(timer);
      }, []);

      return (
        <div class="flex h-screen overflow-hidden bg-slate-950 font-sans">
          {/* Sidebar */}
          <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between select-none">
            <div>
              {/* App Brand */}
              <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
                <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center font-bold text-white text-sm shadow-lg shadow-indigo-500/20">
                  AI
                </div>
                <div>
                  <h1 class="text-sm font-bold text-white tracking-wider uppercase font-mono">Study Assistant</h1>
                  <p class="text-[11px] text-slate-400 font-mono">v0.2.0 • Production</p>
                </div>
              </div>

              {/* Navigation */}
              <nav class="p-3 space-y-1">
                {[
                  { id: "dashboard", label: "Dashboard", icon: Icons.Dashboard, badge: "Overview" },
                  { id: "chat", label: "AI Chat & RAG", icon: Icons.Chat, badge: "NLP" },
                  { id: "classify", label: "Subject Classifier", icon: Icons.Classifier, badge: "PyTorch" },
                  { id: "documents", label: "My Documents", icon: Icons.Documents, badge: "FAISS" },
                  { id: "summarizer", label: "Summarizer Tool", icon: Icons.Summarizer, badge: "Notes" },
                  { id: "quiz", label: "Quiz Generator", icon: Icons.Quiz, badge: "MCQs" },
                  { id: "agent", label: "Autonomous Agent", icon: Icons.Agent, badge: "Router" },
                  { id: "settings", label: "System Health", icon: Icons.Settings, badge: "Status" }
                ].map(item => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      class={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-semibold transition ${
                        isActive
                          ? "bg-indigo-600/15 text-indigo-400 border border-indigo-500/40 shadow-sm shadow-indigo-950"
                          : "text-slate-400 hover:bg-slate-800/70 hover:text-slate-200 border border-transparent"
                      }`}
                    >
                      <div class="flex items-center space-x-2.5">
                        <Icon />
                        <span>{item.label}</span>
                      </div>
                      <span class={`text-[10px] font-mono px-1.5 py-0.5 rounded ${
                        isActive ? "bg-indigo-950 text-indigo-300 border border-indigo-800" : "bg-slate-800/80 text-slate-500"
                      }`}>
                        {item.badge}
                      </span>
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Sidebar Footer */}
            <div class="p-4 border-t border-slate-800 bg-slate-900/60">
              <div class="flex items-center justify-between text-xs font-mono">
                <span class="text-slate-400">Backend API:</span>
                <span class={`font-bold flex items-center space-x-1.5 ${
                  systemStatus === "Online" ? "text-emerald-400" : "text-amber-400"
                }`}>
                  <span class={`h-2 w-2 rounded-full ${
                    systemStatus === "Online" ? "bg-emerald-400 animate-pulse" : "bg-amber-400"
                  }`}></span>
                  <span>{systemStatus}</span>
                </span>
              </div>
              <div class="mt-2 text-[10px] font-mono text-slate-500">
                Host: 127.0.0.1:8000
              </div>
            </div>
          </aside>

          {/* Main Workspace */}
          <main class="flex-1 overflow-y-auto bg-slate-950 p-6 md:p-8">
            {activeTab === "dashboard" && (
              <DashboardView
                data={dashboardData}
                loading={loading}
                onNavigate={setActiveTab}
                onRefresh={fetchDashboardSummary}
              />
            )}
            {activeTab === "chat" && <AIChatView onRefreshMetrics={fetchDashboardSummary} />}
            {activeTab === "classify" && <ClassifierView />}
            {activeTab === "documents" && <DocumentsView onUploaded={fetchDashboardSummary} />}
            {activeTab === "summarizer" && <SummarizerView />}
            {activeTab === "quiz" && <QuizView onRefreshMetrics={fetchDashboardSummary} />}
            {activeTab === "agent" && <AgentView onRefreshMetrics={fetchDashboardSummary} />}
            {activeTab === "settings" && <SettingsView status={systemStatus} />}
          </main>
        </div>
      );
    }

    // ==========================================
    // 1. POLISHED HIGH-FIDELITY DASHBOARD VIEW
    // ==========================================
    function DashboardView({ data, loading, onNavigate, onRefresh }) {
      const [quickQuery, setQuickQuery] = useState("");
      const [quickAnswer, setQuickAnswer] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      const metrics = data?.metrics || {
        total_documents: 1,
        total_questions_asked: 0,
        total_quizzes_generated: 0,
        average_quiz_score: 0.0,
        total_chunks_indexed: 13
      };

      const handleQuickSubmit = async (e) => {
        e.preventDefault();
        if (!quickQuery.trim() || submitting) return;
        setSubmitting(true);
        setQuickAnswer(null);

        try {
          const res = await fetch(`${API_BASE}/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: quickQuery })
          });
          if (res.ok) {
            const result = await res.json();
            setQuickAnswer(result);
            onRefresh();
          } else {
            const err = await res.json();
            setQuickAnswer({ answer: `Error: ${formatErrorDetail(err, "Query failed")}` });
          }
        } catch (err) {
          setQuickAnswer({ answer: `Network Error: ${err.message}` });
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div class="max-w-6xl mx-auto space-y-6">
          {/* Welcome Header */}
          <div class="bg-gradient-to-r from-slate-900 via-indigo-950/40 to-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 relative overflow-hidden shadow-xl shadow-slate-950">
            <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div class="inline-flex items-center space-x-2 px-2.5 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-xs font-mono text-indigo-400 mb-3">
                  <span class="h-1.5 w-1.5 rounded-full bg-indigo-400 animate-ping"></span>
                  <span>AI Study Assistant Active</span>
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">
                  Welcome to Your Study Assistant
                </h2>
                <p class="text-sm text-slate-400 mt-1 max-w-2xl leading-relaxed">
                  Personal AI Tutor with PyTorch Neural Question Classification, Grounded RAG with Document Citations, and Autonomous Tool Routing for Python, AI, and Machine Learning.
                </p>
              </div>

              {/* Status Badges */}
              <div class="flex flex-wrap gap-2 text-xs font-mono">
                <div class="bg-slate-950/80 border border-slate-800 px-3 py-2 rounded-lg text-slate-300">
                  <span class="text-slate-500 block text-[10px]">PyTorch Model</span>
                  <span class="text-emerald-400 font-bold">96.15% Test Acc</span>
                </div>
                <div class="bg-slate-950/80 border border-slate-800 px-3 py-2 rounded-lg text-slate-300">
                  <span class="text-slate-500 block text-[10px]">Embeddings</span>
                  <span class="text-indigo-400 font-bold">all-MiniLM-L6-v2</span>
                </div>
              </div>
            </div>

            {/* Quick Query Bar */}
            <form onSubmit={handleQuickSubmit} class="relative z-10 mt-6 flex gap-2">
              <input
                type="text"
                value={quickQuery}
                onChange={(e) => setQuickQuery(e.target.value)}
                placeholder="Ask any question from your uploaded notes (e.g. 'What is the Global Interpreter Lock in Python?')..."
                class="flex-1 bg-slate-950/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-indigo-500 font-sans shadow-inner"
              />
              <button
                type="submit"
                disabled={submitting || !quickQuery.trim()}
                class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-semibold px-5 py-3 rounded-xl text-xs uppercase tracking-wider transition font-mono flex items-center space-x-1"
              >
                {submitting ? "Searching..." : "Ask Notes"}
              </button>
            </form>

            {/* Quick Answer Output */}
            {quickAnswer && (
              <div class="relative z-10 mt-4 p-4 rounded-xl bg-slate-950/90 border border-indigo-500/40 text-sm space-y-2">
                <div class="flex items-center justify-between text-xs font-mono">
                  <span class="text-indigo-400 font-semibold">[Grounded Answer Preview]</span>
                  <button onClick={() => onNavigate("chat")} class="text-slate-400 hover:text-white underline text-[11px]">
                    Open in Full AI Chat
                  </button>
                </div>
                <div class="mt-2 text-slate-200 leading-relaxed">
                  <FormattedTutorResponse text={quickAnswer.answer} />
                </div>
                {quickAnswer.citations && quickAnswer.citations.length > 0 && (
                  <div class="text-[11px] font-mono text-slate-400 pt-2 border-t border-slate-800">
                    Source: {quickAnswer.citations[0].document_name} (Page {quickAnswer.citations[0].page_number}, Score: {quickAnswer.citations[0].relevance_score})
                  </div>
                )}
              </div>
            )}
          </div>

          {/* KPI Metrics Cards */}
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {/* Card 1 */}
            <div class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 p-5 rounded-xl transition shadow-md">
              <div class="flex items-center justify-between">
                <span class="text-xs uppercase font-mono tracking-wider text-slate-400">Indexed Notes</span>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-indigo-950 text-indigo-400 border border-indigo-800">FAISS</span>
              </div>
              <div class="text-3xl font-extrabold text-white mt-2 font-mono">{metrics.total_documents}</div>
              <div class="text-xs text-slate-400 mt-1 flex items-center justify-between">
                <span>Total Chunks:</span>
                <span class="text-indigo-400 font-semibold">{metrics.total_chunks_indexed || 13}</span>
              </div>
              <div class="mt-3 w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div class="bg-indigo-500 h-full rounded-full" style={{ width: '100%' }}></div>
              </div>
            </div>

            {/* Card 2 */}
            <div class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 p-5 rounded-xl transition shadow-md">
              <div class="flex items-center justify-between">
                <span class="text-xs uppercase font-mono tracking-wider text-slate-400">Questions Asked</span>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">RAG Q&A</span>
              </div>
              <div class="text-3xl font-extrabold text-white mt-2 font-mono">{metrics.total_questions_asked}</div>
              <div class="text-xs text-slate-400 mt-1 flex items-center justify-between">
                <span>Guardrail Threshold:</span>
                <span class="text-emerald-400 font-semibold">0.35 Cosine</span>
              </div>
              <div class="mt-3 w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div class="bg-emerald-500 h-full rounded-full" style={{ width: `${Math.min(100, (metrics.total_questions_asked + 1) * 20)}%` }}></div>
              </div>
            </div>

            {/* Card 3 */}
            <div class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 p-5 rounded-xl transition shadow-md">
